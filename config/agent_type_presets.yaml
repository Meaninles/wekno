agent_type_presets:
- id: knowledge-qa
  i18n:
    default:
      label: Knowledge Q&A
      description: Concise, evidence-based answers with source citations.
    zh-CN:
      label: 知识问答
      description: 基于可靠资料，简洁明确地回答问题，提供必要依据与引用。
    zh-TW:
      label: 知識問答
      description: 基于可靠资料，简洁明确地回答问题，提供必要依据与引用。
    ja-JP:
      label: ナレッジ問答
      description: Concise, evidence-based answers with source citations.
    ko-KR:
      label: 지식 질의응답
      description: Concise, evidence-based answers with source citations.
  config:
    agent_mode: agent
    agent_type: knowledge-qa
    system_prompt_id: progressive_rag_agent
    thinking: true
    temperature: 0.0
    max_completion_tokens: 16384
    max_iterations: 15
    kb_selection_mode: all
    retrieve_kb_only_when_mentioned: false
    allowed_tools:
    - knowledge_search
    - grep_chunks
    - list_knowledge_chunks
    - query_knowledge_graph
    - get_document_info
    web_search_enabled: false
    web_search_max_results: 5
    multi_turn_enabled: true
    history_turns: 10
    faq_priority_enabled: true
    faq_direct_answer_threshold: 0.9
    embedding_top_k: 10
    keyword_threshold: 0.3
    vector_threshold: 0.5
    rerank_top_k: 8
    rerank_threshold: 0.3
- id: wiki-qa
  i18n:
    default:
      label: Wiki Q&A
      description: 'Wiki-first answering: search, read and follow links across wiki pages. Requires a Wiki-enabled KB.'
    zh-CN:
      label: Wiki 问答
      description: 以 Wiki 为主的检索与图谱跳转回答，必须绑定已启用 Wiki 的知识库。
    zh-TW:
      label: Wiki 問答
      description: 以 Wiki 為主的檢索與圖譜跳轉回答，必須綁定已啟用 Wiki 的知識庫。
  config:
    system_prompt_id: wiki_researcher
    thinking: true
    temperature: 0.7
    max_iterations: 50
    allowed_tools:
    - wiki_search
    - wiki_read_page
    - wiki_read_source_doc
    - wiki_flag_issue
    retain_retrieval_history: false
    history_turns: 10
    kb_selection_mode: all
    agent_mode: agent
    max_completion_tokens: 16384
- id: hybrid-rag-wiki
  i18n:
    default:
      label: Hybrid (Wiki + RAG)
      description: Uses wiki pages for navigation and context, then drills into chunks for precise quotes. Requires KBs with
        BOTH Wiki and chunk indexing.
    zh-CN:
      label: Wiki + RAG 混合
      description: 先用 Wiki 建立导航和背景，再用分块检索精确引用。需绑定同时启用 Wiki 与向量/关键词索引的知识库。
    zh-TW:
      label: Wiki + RAG 混合
      description: 先用 Wiki 建立導覽和背景，再用分塊檢索精確引用。需綁定同時啟用 Wiki 與向量/關鍵詞索引的知識庫。
  config:
    system_prompt_id: hybrid_rag_wiki_agent
    thinking: true
    temperature: 0.7
    max_iterations: 50
    allowed_tools:
    - wiki_search
    - wiki_read_page
    - knowledge_search
    - grep_chunks
    - list_knowledge_chunks
    - get_document_info
    - wiki_flag_issue
    retain_retrieval_history: false
    faq_priority_enabled: true
    faq_direct_answer_threshold: 0.9
    kb_selection_mode: all
    agent_mode: agent
    max_completion_tokens: 16384
- id: document-processing-agent
  i18n:
    default:
      label: Document Processing
      description: Document-processing agent. Creates or modifies Word, Excel, PDF and PPT files directly, with the General
        Agent capability set.
    zh-CN:
      label: 文档处理
      description: 文档处理智能体，直接生成或修改 Word / Excel / PDF / PPT 文档，并保留通用智能体能力。
    zh-TW:
      label: 文件處理
      description: 文件處理智能體，直接生成或修改 Word / Excel / PDF / PPT 文件，並保留通用智能體能力。
  config:
    system_prompt_id: document_agent
    thinking: true
    document_template:
      word:
        requirement_file:
          source: builtin
          builtin_id: gbt9704_2012_word_requirement
          file_name: GB_T_9704_2012_党政机关公文格式_Word模板要求.md
          file_type: md
        template_files: []
      excel:
        requirement_file:
          source: builtin
          builtin_id: gbt9704_2012_excel_requirement
          file_name: GB_T_9704_2012_党政机关公文格式_Excel模板要求.md
          file_type: md
        template_files: []
      pdf:
        requirement_file:
          source: builtin
          builtin_id: gbt9704_2012_pdf_requirement
          file_name: GB_T_9704_2012_党政机关公文格式_PDF模板要求.md
          file_type: md
        template_files: []
      ppt:
        requirement_file:
          source: builtin
          builtin_id: gbt9704_2012_ppt_requirement
          file_name: GB_T_9704_2012_党政机关公文格式_PPT模板要求.md
          file_type: md
        template_files: []
    professional_skills_selection_mode: selected
    selected_professional_skills:
    - anysearch-skill
    - find-skill-skillhub
    temperature: 0.4
    max_completion_tokens: 16384
    max_iterations: 50
    llm_call_timeout: 600
    allowed_tools:
    - thinking
    - todo_write
    - knowledge_search
    - grep_chunks
    - list_knowledge_chunks
    - get_document_info
    - query_knowledge_graph
    - wiki_search
    - wiki_read_page
    - wiki_read_source_doc
    - data_schema
    - data_analysis
    - db_catalog
    - db_schema
    - db_query
    retain_retrieval_history: true
    faq_priority_enabled: true
    faq_direct_answer_threshold: 0.9
    web_search_enabled: false
    web_fetch_enabled: true
    web_fetch_top_n: 3
    history_turns: 10
    kb_selection_mode: all
    db_data_sources: []
    enable_artifacts: true
    agent_mode: agent
- id: data-analysis
  i18n:
    default:
      label: Data Analysis
      description: General-agent runtime data analysis agent for bound MySQL / PostgreSQL sources. Pair with one or more data
        sources.
    zh-CN:
      label: 数据分析
      description: 基于通用智能体内核，对已绑定的 MySQL / PostgreSQL 数据源执行 SQL 查询、统计分析和结构化图表展示。
    zh-TW:
      label: 數據分析
      description: 基於通用智能體內核，對已綁定的 MySQL / PostgreSQL 資料來源執行 SQL 查詢、統計分析和結構化圖表展示。
  config:
    system_prompt_id: data_analyst
    thinking: true
    temperature: 0.2
    max_completion_tokens: 16384
    max_iterations: 50
    llm_call_timeout: 600
    allowed_tools:
    - thinking
    - todo_write
    - db_catalog
    - db_schema
    - db_query
    - grep_chunks
    - knowledge_search
    - list_knowledge_chunks
    - query_knowledge_graph
    - get_document_info
    - database_query
    web_search_enabled: false
    web_fetch_enabled: true
    web_fetch_top_n: 3
    history_turns: 10
    embedding_top_k: 10
    kb_selection_mode: all
    db_data_sources: []
    agent_mode: agent
    enable_artifacts: true
- id: table-analysis
  i18n:
    default:
      label: Table Analysis
      description: General-agent runtime table analysis agent for CSV / Excel files. Uses DuckDB SQL over knowledge-base files
        or uploads and can show structured charts on request.
    zh-CN:
      label: 表格分析
      description: 基于通用智能体内核，对知识库或上传的 CSV / Excel 表格执行 DuckDB SQL 查询、统计分析和结构化图表展示。
    zh-TW:
      label: 表格分析
      description: 基於通用智能體內核，對知識庫或上傳的 CSV / Excel 表格執行 DuckDB SQL 查詢、統計分析和結構化圖表展示。
  config:
    system_prompt_id: table_analyst
    thinking: true
    temperature: 0.2
    max_completion_tokens: 16384
    max_iterations: 50
    llm_call_timeout: 600
    allowed_tools:
    - thinking
    - todo_write
    - grep_chunks
    - knowledge_search
    - list_knowledge_chunks
    - query_knowledge_graph
    - get_document_info
    - table_schema
    - table_analysis
    retain_retrieval_history: true
    faq_priority_enabled: false
    web_search_enabled: false
    web_fetch_enabled: true
    web_fetch_top_n: 3
    history_turns: 10
    embedding_top_k: 5
    kb_selection_mode: all
    supported_file_types:
    - csv
    - xlsx
    - xls
    agent_mode: agent
    enable_artifacts: true
- id: general-agent
  i18n:
    default:
      label: General Agent
      description: General-purpose agent. Reuses WeKnora KB retrieval, web search, MCP, Skills, tools and database sources.
    zh-CN:
      label: 通用智能体
      description: 通用智能体，通常不单独使用，建议配合一个或多个专业Skill使用。可复用 WeKnora 检索、工具、MCP、Skills 和数据库数据源。
    zh-TW:
      label: 通用智能體
      description: 通用智能體，復用 WeKnora 知識檢索、網路搜尋、MCP、Skills、工具和資料庫來源。
  config:
    system_prompt_id: general_agent
    thinking: true
    temperature: 0.5
    max_completion_tokens: 16384
    max_iterations: 50
    llm_call_timeout: 600
    allowed_tools:
    - thinking
    - todo_write
    - knowledge_search
    - grep_chunks
    - list_knowledge_chunks
    - get_document_info
    - query_knowledge_graph
    - wiki_search
    - wiki_read_page
    - wiki_read_source_doc
    - data_schema
    - data_analysis
    - db_catalog
    - db_schema
    - db_query
    retain_retrieval_history: true
    faq_priority_enabled: true
    faq_direct_answer_threshold: 0.9
    web_search_enabled: false
    web_fetch_enabled: true
    web_fetch_top_n: 3
    history_turns: 10
    kb_selection_mode: all
    db_data_sources: []
    enable_artifacts: true
    agent_mode: agent
- id: knowledge-base-manager
  i18n:
    default:
      label: Knowledge Base Manager
      description: General-agent runtime with explicitly scoped document add, safe replace and delete capabilities.
    zh-CN:
      label: 知识库管理智能体
      description: 基于通用智能体，在明确指定的知识库内新增、先增后删替换或删除完整文档。
    zh-TW:
      label: 知識庫管理智能體
      description: 基於通用智能體，在明確指定的知識庫內新增、安全替換或刪除完整文件。
  config:
    system_prompt_id: knowledge_base_manager_agent
    thinking: true
    temperature: 0.3
    max_completion_tokens: 16384
    max_iterations: 50
    llm_call_timeout: 600
    allowed_tools:
    - thinking
    - todo_write
    - knowledge_search
    - grep_chunks
    - list_knowledge_chunks
    - get_document_info
    - query_knowledge_graph
    - wiki_search
    - wiki_read_page
    - wiki_read_source_doc
    - kb_list_documents
    - kb_add_document
    - kb_replace_document
    - kb_delete_document
    - kb_mutation_status
    retain_retrieval_history: true
    faq_priority_enabled: false
    web_search_enabled: true
    web_fetch_enabled: true
    web_fetch_top_n: 5
    history_turns: 10
    kb_selection_mode: selected
    enable_artifacts: true
    knowledge_management:
      default_permissions:
        add: true
        modify: true
        delete: true
      knowledge_base_overrides: {}
    agent_mode: agent
  kb_filter:
    none_of:
    - faq
- id: custom
  i18n:
    default:
      label: Custom
      description: Full control. Manually pick tools, prompt and KB scope.
    zh-CN:
      label: 自定义
      description: 完全自定义：自行选择工具、提示词和知识库。
    zh-TW:
      label: 自訂
      description: 完全自訂：自行選擇工具、提示詞和知識庫。
  config:
    agent_mode: agent
    max_iterations: 50
    max_completion_tokens: 16384
