builtin_agents:
- id: builtin-knowledge-qa
  avatar: ''
  is_builtin: true
  i18n:
    default:
      name: Knowledge Q&A
      description: Concise, evidence-based answers with source citations.
    zh-CN:
      name: 知识问答
      description: 基于可靠资料，简洁明确地回答问题，提供必要依据与引用。
    zh-TW:
      name: 知識問答
      description: 基于可靠资料，简洁明确地回答问题，提供必要依据与引用。
    ja-JP:
      name: ナレッジ問答
      description: Concise, evidence-based answers with source citations.
    ko-KR:
      name: 지식 질의응답
      description: Concise, evidence-based answers with source citations.
  config:
    agent_mode: agent
    image_upload_enabled: true
    audio_upload_enabled: true
    agent_type: knowledge-qa
    system_prompt_id: progressive_rag_agent
    thinking: true
    temperature: 0.0
    max_completion_tokens: 16384
    max_iterations: 15
    kb_selection_mode: all
    retrieve_kb_only_when_mentioned: false
    allowed_tools:
    - knowledge_search
    - grep_chunks
    - list_knowledge_chunks
    - query_knowledge_graph
    - get_document_info
    web_search_enabled: false
    web_search_max_results: 5
    multi_turn_enabled: true
    history_turns: 10
    faq_priority_enabled: true
    faq_direct_answer_threshold: 0.9
    embedding_top_k: 10
    keyword_threshold: 0.3
    vector_threshold: 0.5
    rerank_top_k: 8
    rerank_threshold: 0.3
- id: builtin-data-analyst
  avatar: 🗄️
  is_builtin: true
  i18n:
    default:
      name: Data Analyst
      description: General-agent runtime data analysis agent for bound MySQL/PostgreSQL sources with SQL and optional structured
        charts
    zh-CN:
      name: 数据分析
      description: 数据分析智能体，支持绑定 MySQL/PostgreSQL 数据源并使用 SQL 分析数据，可按用户要求生成结构化图表
    zh-TW:
      name: 數據分析
      description: 數據分析智能體，支援綁定 MySQL/PostgreSQL 資料來源並使用 SQL 分析資料，可按使用者要求生成結構化圖表
    ja-JP:
      name: データアナリスト
      description: MySQL/PostgreSQL データソースをバインドして SQL 分析し、必要に応じて構造化チャートを生成するデータ分析エージェント
    ko-KR:
      name: 데이터 분석가
      description: MySQL/PostgreSQL 데이터 소스를 바인딩하고 SQL로 분석하며 요청 시 구조화 차트를 생성하는 데이터 분석 에이전트
  config:
    agent_mode: agent
    image_upload_enabled: true
    audio_upload_enabled: true
    agent_type: data-analysis
    system_prompt_id: data_analyst
    thinking: true
    temperature: 0.2
    max_completion_tokens: 16384
    max_iterations: 100
    llm_call_timeout: 600
    kb_selection_mode: all
    retrieve_kb_only_when_mentioned: false
    db_data_sources: []
    allowed_tools:
    - thinking
    - todo_write
    - db_catalog
    - db_schema
    - db_query
    - grep_chunks
    - knowledge_search
    - list_knowledge_chunks
    - query_knowledge_graph
    - get_document_info
    - database_query
    web_search_enabled: false
    web_search_max_results: 0
    web_fetch_enabled: true
    web_fetch_top_n: 3
    multi_turn_enabled: true
    history_turns: 10
    embedding_top_k: 5
    keyword_threshold: 0.3
    vector_threshold: 0.5
    rerank_top_k: 5
    rerank_threshold: 0.3
    enable_artifacts: true
- id: builtin-table-analyst
  avatar: 📊
  is_builtin: true
  i18n:
    default:
      name: Table Analyst
      description: CSV/Excel table analysis agent with DuckDB SQL and optional structured charts
    zh-CN:
      name: 表格分析
      description: 支持从知识库或上传的 CSV/Excel 文件中选择表格，使用 DuckDB SQL 分析并按需生成结构化图表
    zh-TW:
      name: 表格分析
      description: 支援從知識庫或上傳的 CSV/Excel 文件中選擇表格，使用 DuckDB SQL 分析並按需生成結構化圖表
    ja-JP:
      name: テーブル分析
      description: ナレッジベースまたはアップロードされた CSV/Excel を DuckDB SQL で分析し、必要に応じて構造化チャートを生成するエージェント
    ko-KR:
      name: 표 분석
      description: 지식 베이스 또는 업로드한 CSV/Excel 파일을 DuckDB SQL로 분석하고 요청 시 구조화 차트를 생성하는 에이전트
  config:
    agent_mode: agent
    image_upload_enabled: true
    audio_upload_enabled: true
    agent_type: table-analysis
    system_prompt_id: table_analyst
    thinking: true
    temperature: 0.2
    max_completion_tokens: 16384
    max_iterations: 100
    llm_call_timeout: 600
    kb_selection_mode: all
    retrieve_kb_only_when_mentioned: false
    supported_file_types:
    - csv
    - xlsx
    - xls
    allowed_tools:
    - thinking
    - todo_write
    - grep_chunks
    - knowledge_search
    - list_knowledge_chunks
    - query_knowledge_graph
    - get_document_info
    - table_schema
    - table_analysis
    web_search_enabled: false
    web_search_max_results: 0
    web_fetch_enabled: true
    web_fetch_top_n: 3
    multi_turn_enabled: true
    history_turns: 10
    faq_priority_enabled: false
    embedding_top_k: 10
    keyword_threshold: 0.3
    vector_threshold: 0.5
    rerank_top_k: 5
    rerank_threshold: 0.3
    enable_artifacts: true
- id: builtin-general-agent
  avatar: 🧠
  is_builtin: true
  i18n:
    default:
      name: General Agent
      description: General-purpose agent that reuses WeKnora retrieval, tools, MCP, Skills and database sources
    zh-CN:
      name: 通用智能体
      description: 通用智能体，通常不单独使用，建议配合一个或多个专业Skill使用。可复用 WeKnora 检索、工具、MCP、Skills 和数据库数据源。
    zh-TW:
      name: 通用智能體
      description: 通用智能體，復用 WeKnora 檢索、工具、MCP、Skills 和資料庫來源
    ja-JP:
      name: 汎用エージェント
      description: WeKnora の検索、ツール、MCP、Skills、データベースソースを再利用する汎用エージェント
    ko-KR:
      name: 범용 에이전트
      description: WeKnora 검색, 도구, MCP, Skills 및 데이터베이스 소스를 재사용하는 범용 에이전트
  config:
    agent_mode: agent
    image_upload_enabled: true
    audio_upload_enabled: true
    agent_type: general-agent
    system_prompt_id: general_agent
    thinking: true
    temperature: 0.0
    max_completion_tokens: 16384
    max_iterations: 100
    llm_call_timeout: 600
    kb_selection_mode: all
    retrieve_kb_only_when_mentioned: false
    db_data_sources: []
    professional_skills_selection_mode: selected
    selected_professional_skills:
    - anysearch-skill
    - find-skill-skillhub
    allowed_tools:
    - knowledge_search
    - grep_chunks
    - list_knowledge_chunks
    - get_document_info
    - query_knowledge_graph
    - wiki_search
    - wiki_read_page
    - wiki_read_source_doc
    - data_schema
    - data_analysis
    - db_catalog
    - db_schema
    - db_query
    web_search_enabled: false
    web_search_max_results: 5
    web_fetch_enabled: true
    web_fetch_top_n: 3
    enable_artifacts: true
    multi_turn_enabled: true
    history_turns: 10
    retain_retrieval_history: true
    faq_priority_enabled: true
    faq_direct_answer_threshold: 0.9
    embedding_top_k: 10
    keyword_threshold: 0.3
    vector_threshold: 0.5
    rerank_top_k: 8
    rerank_threshold: 0.3
- id: builtin-document-processing
  avatar: 📄
  is_builtin: true
  i18n:
    default:
      name: Document Processing
      description: Document-processing agent that creates or modifies Word, Excel, PDF and PPT files directly
    zh-CN:
      name: 文档处理
      description: 文档处理智能体，直接生成或修改 Word / Excel / PDF / PPT 文档
    zh-TW:
      name: 文件處理
      description: 文件處理智能體，直接生成或修改 Word / Excel / PDF / PPT 文件
    ja-JP:
      name: ドキュメント処理
      description: Word / Excel / PDF / PPT を直接作成または編集するドキュメント処理エージェント
    ko-KR:
      name: 문서 처리
      description: Word / Excel / PDF / PPT 문서를 직접 생성하거나 수정하는 문서 처리 에이전트
  config:
    agent_mode: agent
    image_upload_enabled: true
    audio_upload_enabled: true
    agent_type: document-processing-agent
    system_prompt_id: document_agent
