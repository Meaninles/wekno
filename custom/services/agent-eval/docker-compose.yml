name: weknora-agent-eval-platform

x-langfuse-environment: &langfuse-environment
  _LF_DB_USER: ${DB_USER}
  _LF_DB_PASSWORD: ${DB_PASSWORD}
  _LF_DB_NAME: langfuse_agent_eval
  _LF_REDIS_PASSWORD: ${REDIS_PASSWORD}
  SALT: ${AGENT_EVAL_LANGFUSE_SALT:-weknora-agent-eval-local-salt-change-before-sharing}
  ENCRYPTION_KEY: ${AGENT_EVAL_LANGFUSE_ENCRYPTION_KEY:-1111111111111111111111111111111111111111111111111111111111111111}
  NEXTAUTH_URL: http://localhost:${AGENT_EVAL_LANGFUSE_WEB_PORT:-13001}
  NEXTAUTH_SECRET: ${AGENT_EVAL_LANGFUSE_NEXTAUTH_SECRET:-weknora-agent-eval-local-nextauth-change-before-sharing}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_URL: http://agent-eval-langfuse-clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://agent-eval-langfuse-clickhouse:9000
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${AGENT_EVAL_CLICKHOUSE_PASSWORD:-agent-eval-clickhouse-local}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-agent-eval
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-agent-eval
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${MINIO_PORT:-19000}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

x-langfuse-worker-command: &langfuse-worker-command
  - /bin/sh
  - -ec
  - |
      _enc() { node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$$1"; }
      DU=$$(_enc "$$_LF_DB_USER")
      DP=$$(_enc "$$_LF_DB_PASSWORD")
      RP=$$(_enc "$$_LF_REDIS_PASSWORD")
      export DATABASE_URL="postgresql://$$DU:$$DP@postgres:5432/$$_LF_DB_NAME"
      export REDIS_CONNECTION_STRING="redis://:$$RP@redis:6379/1"
      unset _LF_DB_USER _LF_DB_PASSWORD _LF_REDIS_PASSWORD
      exec dumb-init -- ./worker/entrypoint.sh node worker/dist/index.js

x-langfuse-web-command: &langfuse-web-command
  - /bin/sh
  - -ec
  - |
      _enc() { node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$$1"; }
      DU=$$(_enc "$$_LF_DB_USER")
      DP=$$(_enc "$$_LF_DB_PASSWORD")
      RP=$$(_enc "$$_LF_REDIS_PASSWORD")
      export DATABASE_URL="postgresql://$$DU:$$DP@postgres:5432/$$_LF_DB_NAME"
      export REDIS_CONNECTION_STRING="redis://:$$RP@redis:6379/1"
      unset _LF_DB_USER _LF_DB_PASSWORD _LF_REDIS_PASSWORD
      exec dumb-init -- ./web/entrypoint.sh node ./web/server.js --keepAliveTimeout 110000

services:
  agent-eval-langfuse-db-init:
    image: postgres:17-alpine
    container_name: weknora-agent-eval-langfuse-db-init
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
    command:
      - /bin/sh
      - -ec
      - |
          until pg_isready -h postgres -U "$$DB_USER"; do sleep 1; done
          if ! psql -h postgres -U "$$DB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='langfuse_agent_eval'" | grep -q 1; then
            psql -h postgres -U "$$DB_USER" -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE langfuse_agent_eval TEMPLATE template0;'
          fi
    networks:
      - agent-eval-network
    restart: "no"

  agent-eval-langfuse-bucket-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: weknora-agent-eval-langfuse-bucket-init
    environment:
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint:
      - /bin/sh
      - -ec
      - |
          until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY_ID" "$$MINIO_SECRET_ACCESS_KEY"; do sleep 1; done
          mc mb --ignore-existing local/langfuse-agent-eval
    networks:
      - agent-eval-network
    restart: "no"

  agent-eval-langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: weknora-agent-eval-langfuse-clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${AGENT_EVAL_CLICKHOUSE_PASSWORD:-agent-eval-clickhouse-local}
    volumes:
      - agent_eval_langfuse_clickhouse_data:/var/lib/clickhouse
      - agent_eval_langfuse_clickhouse_logs:/var/log/clickhouse-server
    networks:
      - agent-eval-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  agent-eval-langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.22.0
    container_name: weknora-agent-eval-langfuse-worker
    depends_on:
      agent-eval-langfuse-db-init:
        condition: service_completed_successfully
      agent-eval-langfuse-bucket-init:
        condition: service_completed_successfully
      agent-eval-langfuse-clickhouse:
        condition: service_healthy
    entrypoint: *langfuse-worker-command
    environment:
      <<: *langfuse-environment
    networks:
      - agent-eval-network
    restart: unless-stopped

  agent-eval-langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.22.0
    container_name: weknora-agent-eval-langfuse-web
    depends_on:
      agent-eval-langfuse-db-init:
        condition: service_completed_successfully
      agent-eval-langfuse-bucket-init:
        condition: service_completed_successfully
      agent-eval-langfuse-clickhouse:
        condition: service_healthy
    entrypoint: *langfuse-web-command
    environment:
      <<: *langfuse-environment
      LANGFUSE_INIT_ORG_ID: weknora-agent-eval
      LANGFUSE_INIT_ORG_NAME: WeKnora Agent Eval
      LANGFUSE_INIT_PROJECT_ID: weknora-agent-eval
      LANGFUSE_INIT_PROJECT_NAME: WeKnora Agent Eval
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-weknora-agent-eval-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-weknora-agent-eval-local}
      LANGFUSE_INIT_USER_EMAIL: ${AGENT_EVAL_LANGFUSE_USER_EMAIL:-agent-eval@example.com}
      LANGFUSE_INIT_USER_NAME: ${AGENT_EVAL_LANGFUSE_USER_NAME:-Agent Eval}
      LANGFUSE_INIT_USER_PASSWORD: ${AGENT_EVAL_LANGFUSE_USER_PASSWORD:-agent-eval-local-password}
    ports:
      - "${AGENT_EVAL_LANGFUSE_WEB_PORT:-13001}:3000"
    networks:
      agent-eval-network:
        aliases:
          - weknora-agent-eval-langfuse-web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://' + process.env.HOSTNAME + ':3000/api/public/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    restart: unless-stopped

  agent-eval-runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: Dockerfile
    image: weknora-agent-eval-runner:local
    container_name: weknora-agent-eval-runner
    env_file:
      - path: ${AGENT_EVAL_RUNNER_ENV_FILE:-./runner.env}
        required: false
    environment:
      WEKNORA_BASE_URL: http://runtime-entry:8080/api/v1
      LANGFUSE_HOST: http://weknora-agent-eval-langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-weknora-agent-eval-local}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-weknora-agent-eval-local}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-agent-eval}
      AGENT_EVAL_FRAMEWORK_COMMIT: ${AGENT_EVAL_FRAMEWORK_COMMIT:-unknown}
      AGENT_EVAL_WORKTREE_DIRTY: ${AGENT_EVAL_WORKTREE_DIRTY:-unknown}
    volumes:
      - ./datasets:/workspace/datasets:ro
      - ./manifests:/workspace/manifests:ro
      - ./profiles:/workspace/profiles:ro
      - ./calibration:/workspace/calibration:ro
      - ./sealed:/workspace/sealed:ro
      - ./artifacts:/workspace/artifacts
      - ./policies:/workspace/policies:ro
    networks:
      - agent-eval-network

networks:
  agent-eval-network:
    external: true
    name: ${WEKNORA_DEV_NETWORK_NAME:-weknora-agent-eval-network}

volumes:
  agent_eval_langfuse_clickhouse_data:
  agent_eval_langfuse_clickhouse_logs:
