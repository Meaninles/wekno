[project]
name = "weknora-agent-runtime"
version = "1.0.0"
description = "Unified WeKnora AgentScope runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentscope==2.0.7.post1",
  # AgentScope 2.0.7 uses the httpx-based Anthropic client API; 1.x changed
  # both the transport type and generation parameter signatures.
  "anthropic>=0.93,<1",
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "httpx==0.28.1",
  "websockets>=15,<16",
  "aiodocker>=0.25,<0.26",
  "kubernetes-asyncio>=32,<34",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
