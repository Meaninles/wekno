name: weknora-artifact-storage-e2e

services:
  app-entry:
    image: nginx:stable-alpine
    container_name: weknora-artifact-app-e2e-entry
    restart: "no"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:18088:8080"
    networks:
      - weknora-dev
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64

networks:
  weknora-dev:
    external: true
    name: ${WEKNORA_DEV_NETWORK:-weknora_WeKnora-network-dev}
