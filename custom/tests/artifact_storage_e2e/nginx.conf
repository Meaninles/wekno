worker_processes 1;

events {
    worker_connections 512;
}

http {
    upstream app_replicas {
        least_conn;
        server app-dev:8080 max_fails=1 fail_timeout=2s;
        server worker-cluster-e2e-a:8080 max_fails=1 fail_timeout=2s;
        keepalive 16;
    }

    log_format replica '$remote_addr "$request" $status upstream=$upstream_addr '
                       'upstream_status=$upstream_status request_time=$request_time';
    access_log /var/log/nginx/access.log replica;

    server {
        listen 8080;
        client_max_body_size 128m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://app_replicas;
            add_header X-WeKnora-Test-Upstream $upstream_addr always;
        }
    }
}
