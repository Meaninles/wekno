name: ${WEKNORA_RUNTIME_PROJECT_NAME:-weknora-runtime-profile-e2e}

x-runtime-common: &runtime-common
  image: ${WEKNORA_RUNTIME_IMAGE:-weknora-runtime-profile-e2e:local}
  build:
    context: ../../..
    dockerfile: custom/tests/runtime_profile_e2e/Dockerfile
    args:
      RUNTIME_BASE_IMAGE: ${WEKNORA_RUNTIME_BASE_IMAGE:-weknora-dev-app:local}
  working_dir: /workspace
  env_file:
    - ${WEKNORA_RUNTIME_ENV_FILE:-../../../.env}
  environment: &runtime-environment
    GIN_MODE: release
    CUSTOM_RUNTIME_ENV: production
    CUSTOM_RUNTIME_ROLE_ENFORCED: "true"
    CUSTOM_POSTGRES_MAX_CONNECTIONS: "100"
    CUSTOM_RUNTIME_API_REPLICAS: "3"
    CUSTOM_RUNTIME_PARSE_WORKER_REPLICAS: "2"
    CUSTOM_RUNTIME_DERIVATIVE_WORKER_REPLICAS: "2"
    CUSTOM_RUNTIME_WIKI_WORKER_REPLICAS: "2"
    CUSTOM_RUNTIME_MAINTENANCE_REPLICAS: "2"
    CUSTOM_RUNTIME_MIGRATION_REPLICAS: "1"
    CUSTOM_RUNTIME_ROLLING_CONNECTION_BUDGET: "70"
    AUTO_MIGRATE: "false"
    CUSTOM_AUTO_MIGRATE: "false"
    DB_HOST: ${WEKNORA_RUNTIME_DB_HOST:-postgres}
    DB_PORT: "5432"
    DEV_DOCKER_DB_HOST: ${WEKNORA_RUNTIME_DB_HOST:-postgres}
    DEV_DOCKER_DB_PORT: "5432"
    REDIS_ADDR: ${WEKNORA_RUNTIME_REDIS_ADDR:-redis:6379}
    DEV_DOCKER_REDIS_ADDR: ${WEKNORA_RUNTIME_REDIS_ADDR:-redis:6379}
    MINIO_ENDPOINT: ${WEKNORA_RUNTIME_MINIO_ENDPOINT:-minio:9000}
    DEV_DOCKER_MINIO_ENDPOINT: ${WEKNORA_RUNTIME_MINIO_ENDPOINT:-minio:9000}
    MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
    MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-weknora-original-inputs}
    MINIO_PATH_PREFIX: ${MINIO_PATH_PREFIX:-weknora/__weknora_private_knowledge_objects_v1__/deployment/dev-local/namespace/74b3d025-5a14-4a6d-b0fc-ff228d0ba98c/}
    STORAGE_TYPE: minio
    MILVUS_ADDRESS: ${WEKNORA_RUNTIME_MILVUS_ADDRESS:-milvus:19530}
    NEO4J_URI: ${WEKNORA_RUNTIME_NEO4J_URI:-bolt://neo4j:7687}
    QDRANT_HOST: ${WEKNORA_RUNTIME_QDRANT_HOST:-qdrant}
    LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
    LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
    LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
    LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-0}
    DOCREADER_TRANSPORT: grpc
    BATCH_EMBED_SIZE: ${BATCH_EMBED_SIZE:-5}
    DUCKDB_SKIP_EXTENSION_LOAD: "true"
    LOCAL_STORAGE_BASE_DIR: /workspace/.local-data/files
    CUSTOM_MODEL_ADMISSION_ENABLED: "true"
    CUSTOM_MODEL_ADMISSION_FAIL_CLOSED: "true"
    CUSTOM_MODEL_ADMISSION_KEY_PREFIX: "weknora:model-admission:v2:"
    CUSTOM_DOCUMENT_QUEUE_TRUST_STABLE_INSTANCE_RESTART: "true"
    AGENT_RUNTIME_API_KEY: ${AGENT_RUNTIME_API_KEY:-dev-agent-runtime-key}
    AGENT_RUNTIME_MAX_TOTAL_TOKENS: ${AGENT_RUNTIME_MAX_TOTAL_TOKENS:-3000000}
    AGENT_RUNTIME_KNOWLEDGE_QA_MAX_TOTAL_TOKENS: ${AGENT_RUNTIME_KNOWLEDGE_QA_MAX_TOTAL_TOKENS:-1000000}
    AGENT_RUNTIME_MAX_MODEL_REQUESTS: ${AGENT_RUNTIME_MAX_MODEL_REQUESTS:-100}
    AGENT_RUNTIME_ARTIFACT_MAX_TOTAL_TOKENS: ${AGENT_RUNTIME_ARTIFACT_MAX_TOTAL_TOKENS:-6000000}
    AGENT_RUNTIME_ARTIFACT_MAX_MODEL_REQUESTS: ${AGENT_RUNTIME_ARTIFACT_MAX_MODEL_REQUESTS:-200}
    AGENT_RUNTIME_TOOL_CALLBACK_URL: http://runtime-entry:8080/api/v1/custom/agent-runtime/internal/tools/call
    AGENT_RUNTIME_ARTIFACT_UPLOAD_URL: http://runtime-entry:8080/api/v1/custom/agent-runtime/internal/artifacts/upload
    AGENT_RUNTIME_ARTIFACT_STORAGE_PROVIDER: minio
    AGENT_RUNTIME_ARTIFACT_BUCKET: ${AGENT_RUNTIME_ARTIFACT_BUCKET:-weknora-original-inputs}
    AGENT_RUNTIME_ARTIFACT_PATH_PREFIX: ${AGENT_RUNTIME_ARTIFACT_PATH_PREFIX:-weknora/__weknora_private_agent_artifacts_v1__/deployment/dev-local/namespace/74b3d025-5a14-4a6d-b0fc-ff228d0ba98c/}
    AGENT_RUNTIME_ORIGINAL_INPUT_STORAGE_PROVIDER: minio
    AGENT_RUNTIME_ORIGINAL_INPUT_BUCKET: ${AGENT_RUNTIME_ORIGINAL_INPUT_BUCKET:-weknora-original-inputs}
    AGENT_RUNTIME_ORIGINAL_INPUT_PATH_PREFIX: ${AGENT_RUNTIME_ORIGINAL_INPUT_PATH_PREFIX:-weknora/__weknora_claude_sdk_original_inputs_v1__/deployment/dev-local/namespace/74b3d025-5a14-4a6d-b0fc-ff228d0ba98c/}
    CUSTOM_SKILLHUB_PROFESSIONAL_STORAGE_PROVIDER: minio
    CUSTOM_SKILLHUB_PROFESSIONAL_BUCKET: ${CUSTOM_SKILLHUB_PROFESSIONAL_BUCKET:-weknora-original-inputs}
    CUSTOM_SKILLHUB_PROFESSIONAL_PATH_PREFIX: ${CUSTOM_SKILLHUB_PROFESSIONAL_PATH_PREFIX:-weknora/__weknora_private_professional_skills_v1__/deployment/dev-local/namespace/74b3d025-5a14-4a6d-b0fc-ff228d0ba98c/}
  volumes:
    - ../../..:/workspace
    - weknora-go-mod-cache:/go/pkg/mod:ro
  networks:
    - weknora-dev
  restart: "no"
  depends_on: &runtime-migration-dependency
    migration:
      condition: service_completed_successfully
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 15s

services:
  migration:
    <<: *runtime-common
    depends_on: {}
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-migration
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: migration
      # The migration role enables custom migrations exactly once; native
      # migrations remain disabled for the shared development database.
      AUTO_MIGRATE: ${WEKNORA_RUNTIME_NATIVE_AUTO_MIGRATE:-false}
      CUSTOM_AUTO_MIGRATE: "true"
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "3"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "1"
    healthcheck:
      disable: true

  runtime-api-1:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-api-1
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: api
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "6"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "2"

  runtime-api-2:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-api-2
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: api
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "6"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "2"

  runtime-api-3:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-api-3
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: api
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "6"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "2"

  runtime-parse-1:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-parse-1
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: parse-worker
      DOCREADER_ADDR: runtime-docreader-entry:50051
      DEV_DOCKER_DOCREADER_ADDR: runtime-docreader-entry:50051
      CUSTOM_DOCUMENT_QUEUE_INSTANCE_ID: runtime-parse-1
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "5"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "2"
    depends_on:
      <<: *runtime-migration-dependency
      runtime-docreader-entry:
        condition: service_started

  runtime-parse-2:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-parse-2
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: parse-worker
      DOCREADER_ADDR: runtime-docreader-entry:50051
      DEV_DOCKER_DOCREADER_ADDR: runtime-docreader-entry:50051
      CUSTOM_DOCUMENT_QUEUE_INSTANCE_ID: runtime-parse-2
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "5"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "2"
    depends_on:
      <<: *runtime-migration-dependency
      runtime-docreader-entry:
        condition: service_started
      runtime-docreader-2:
        condition: service_healthy

  runtime-derivative-1:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-derivative-1
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: derivative-worker
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "4"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "1"

  runtime-derivative-2:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-derivative-2
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: derivative-worker
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "4"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "1"

  runtime-wiki-1:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-wiki-1
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: wiki-worker
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "3"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "1"

  runtime-wiki-2:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-wiki-2
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: wiki-worker
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "3"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "1"

  runtime-maintenance-1:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-maintenance-1
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: maintenance
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "2"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "1"

  runtime-maintenance-2:
    <<: *runtime-common
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-maintenance-2
    environment:
      <<: *runtime-environment
      WEKNORA_RUNTIME_ROLE: maintenance
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "2"
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "1"

  runtime-docreader-2:
    image: ${WEKNORA_RUNTIME_DOCREADER_IMAGE:-wechatopenai/weknora-docreader:latest}
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-docreader-2
    environment:
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      DOCREADER_HEALTH_GRPC_PORT: "50052"
      DOCREADER_GRPC_MAX_WORKERS: "4"
    networks:
      weknora-dev:
        aliases:
          - runtime-docreader-2
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:50052", "-connect-timeout=1s", "-rpc-timeout=5s"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: "no"

  runtime-docreader-3:
    image: ${WEKNORA_RUNTIME_DOCREADER_IMAGE:-wechatopenai/weknora-docreader:latest}
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-docreader-3
    environment:
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      DOCREADER_HEALTH_GRPC_PORT: "50052"
      DOCREADER_GRPC_MAX_WORKERS: "4"
    networks:
      weknora-dev:
        aliases:
          - runtime-docreader-3
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:50052", "-connect-timeout=1s", "-rpc-timeout=5s"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: "no"

  runtime-docreader-entry:
    image: haproxy:3.2-alpine
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-docreader-entry
    depends_on:
      runtime-docreader-2:
        condition: service_healthy
      runtime-docreader-3:
        condition: service_healthy
    volumes:
      - ./haproxy-docreader.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      weknora-dev:
        aliases:
          - runtime-docreader-entry
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: "no"

  runtime-entry:
    image: haproxy:3.2-alpine
    container_name: ${WEKNORA_RUNTIME_CONTAINER_PREFIX:-weknora-runtime}-entry
    depends_on:
      runtime-api-1:
        condition: service_healthy
      runtime-api-2:
        condition: service_healthy
      runtime-api-3:
        condition: service_healthy
    volumes:
      - ./haproxy-api.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${WEKNORA_RUNTIME_API_PORT:-8080}:8080"
    networks:
      weknora-dev:
        aliases:
          - runtime-entry
          - app-dev
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: "no"

networks:
  weknora-dev:
    external: true
    name: ${WEKNORA_RUNTIME_NETWORK_NAME:-weknora_WeKnora-network-dev}

volumes:
  weknora-go-mod-cache:
    external: true
    name: ${WEKNORA_RUNTIME_GO_MOD_CACHE_NAME:-weknora_go-mod-cache-dev}
