global
    log stdout format raw local0

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold nx 2s
    hold other 2s
    hold refused 2s
    hold timeout 2s

defaults
    log global
    mode http
    option httplog
    option http-keep-alive
    timeout connect 1s
    timeout client 2h
    timeout server 2h

frontend runtime_api
    bind *:8080
    acl load_balancer_health path -i /lb-health
    http-request return status 200 content-type application/json string '{"status":"ok","topology":"runtime-profile-e2e"}' if load_balancer_health
    default_backend api_replicas

backend api_replicas
    balance leastconn
    option httpchk GET /health
    option redispatch
    retries 3
    retry-on conn-failure empty-response response-timeout 502 503 504
    http-check expect status 200
    default-server check inter 1s fall 1 rise 1 resolvers docker init-addr last,libc,none
    server api_1 runtime-api-1:8080
    server api_2 runtime-api-2:8080
    server api_3 runtime-api-3:8080
