global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 2h
    timeout server 2h

frontend docreader_grpc
    bind *:50051
    default_backend docreader_replicas

backend docreader_replicas
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 2 rise 1
    # Resolve the Compose service alias on the current isolated network. This
    # points to the shared or runtime-profile DocReader without coupling to a
    # container name.
    server docreader_1 docreader:50051 check
    server docreader_2 runtime-docreader-2:50051 check
    server docreader_3 runtime-docreader-3:50051 check
