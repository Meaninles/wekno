global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option http-keep-alive
    timeout http-request 60s
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend mcp_frontend
    bind *:8000
    default_backend mcp_backends

backend mcp_backends
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server mcp1 runtime-mcp-1:8000 check inter 5s fall 3 rise 2
    server mcp2 runtime-mcp-2:8000 check inter 5s fall 3 rise 2

