worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Agent requests can carry base64-encoded user attachments. 50 MiB input
    # expands to roughly 67 MiB in JSON, so the nginx 1 MiB default is not
    # suitable for the same workload accepted by the application.
    client_max_body_size 128m;

    log_format replica '$remote_addr "$request" $status upstream=$upstream_addr '
                       'upstream_status=$upstream_status request_time=$request_time';
    access_log /var/log/nginx/access.log replica;

    upstream general_agent {
        least_conn;
        server general-agent-1:8091 max_fails=1 fail_timeout=2s;
        server general-agent-2:8091 max_fails=1 fail_timeout=2s;
    }

    upstream document_agent {
        least_conn;
        server document-agent-1:8091 max_fails=1 fail_timeout=2s;
        server document-agent-2:8091 max_fails=1 fail_timeout=2s;
    }

    upstream mobile_web {
        least_conn;
        server mobile-web-1:80 max_fails=1 fail_timeout=2s;
        server mobile-web-2:80 max_fails=1 fail_timeout=2s;
    }

    upstream frontend_web {
        least_conn;
        server frontend-web-1:80 max_fails=1 fail_timeout=2s;
        server frontend-web-2:80 max_fails=1 fail_timeout=2s;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 7200s;
    proxy_read_timeout 7200s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    server {
        listen 8091 default_server;
        server_name weknora-custom-general-agent localhost;

        location / {
            proxy_pass http://general_agent;
            add_header X-E2E-Upstream $upstream_addr always;
        }
    }

    server {
        listen 8091;
        listen 8093 default_server;
        server_name weknora-custom-document-processing-agent;

        location / {
            proxy_pass http://document_agent;
            add_header X-E2E-Upstream $upstream_addr always;
        }
    }

    server {
        listen 80;
        client_max_body_size 2304m;

        location / {
            proxy_pass http://mobile_web;
            add_header X-E2E-Upstream $upstream_addr always;
        }
    }

    server {
        listen 81;
        client_max_body_size 2304m;

        location / {
            proxy_pass http://frontend_web;
            add_header X-E2E-Upstream $upstream_addr always;
        }
    }
}
