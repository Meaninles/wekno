# Render only helm/templates/app-migration-job.yaml during the maintenance
# window. The normal workload manifest keeps the migration contract enabled
# but must set migration.render=false so no Job is mixed into the apply set.
# This Job changes PostgreSQL only; /data/files is not mounted or copied.

app:
  runtimeRoles:
    enabled: true
    migration:
      enabled: true
      render: true
      jobNameSuffix: REPLACE_RELEASE_ID
      nodeSelector:
        kubernetes.io/hostname: "10.14.201.7"
      scratch:
        volumeType: hostPath
        hostPath:
          path: /mnt/weknora-data/weknora-v2-scratch/migration
          # Release preparation creates this directory first. Fail closed if
          # it is missing instead of silently writing to the node root disk.
          type: Directory
      backoffLimit: 0
      activeDeadlineSeconds: 7200
  documentQueue:
    kubernetesRuntimeVerifier:
      enabled: false

# Compatibility storage only. Durable files remain unchanged in their current
# PostgreSQL-backed location and are deliberately outside this migration.
dataFiles:
  persistence:
    enabled: false
  emptyDir:
    sizeLimit: 1Gi
