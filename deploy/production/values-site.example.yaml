# Copy this file to a protected operator workspace as values-site.yaml.
# Replace every REPLACE_* token before rendering. Digests are mandatory; tags
# remain human-readable release labels but are never the runtime identity.

app:
  runtimeRoles:
    migration:
      jobNameSuffix: REPLACE_RELEASE_ID
  image:
    repository: swr.cloud-mt-1.moutai.com.cn/REPLACE_SWR_NAMESPACE/weknora-app
    tag: REPLACE_GIT_SHA
    digest: REPLACE_APP_DIGEST
    pullPolicy: IfNotPresent
docreader:
  image:
    repository: swr.cloud-mt-1.moutai.com.cn/REPLACE_SWR_NAMESPACE/weknora-docreader
    tag: REPLACE_GIT_SHA
    digest: REPLACE_DOCREADER_DIGEST
    pullPolicy: IfNotPresent

agentRuntime:
  image:
    repository: swr.cloud-mt-1.moutai.com.cn/REPLACE_SWR_NAMESPACE/weknora-agent-runtime
    tag: REPLACE_GIT_SHA
    digest: REPLACE_AGENT_RUNTIME_DIGEST
    pullPolicy: IfNotPresent
  workspace:
    image: swr.cloud-mt-1.moutai.com.cn/REPLACE_SWR_NAMESPACE/weknora-agent-workspace@REPLACE_AGENT_WORKSPACE_DIGEST

frontend:
  image:
    repository: swr.cloud-mt-1.moutai.com.cn/REPLACE_SWR_NAMESPACE/weknora-frontend
    tag: REPLACE_GIT_SHA
    digest: REPLACE_FRONTEND_DIGEST
    pullPolicy: IfNotPresent

mobileWeb:
  image:
    repository: swr.cloud-mt-1.moutai.com.cn/REPLACE_SWR_NAMESPACE/weknora-mobile-web
    tag: REPLACE_GIT_SHA
    digest: REPLACE_MOBILE_WEB_DIGEST
    pullPolicy: IfNotPresent
