services:
  app-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev-app
    image: weknora-dev-app:local
    container_name: WeKnora-app-dev
    working_dir: /workspace
    env_file:
      - .env
    environment:
      GIN_MODE: debug
      DB_HOST: postgres
      DB_PORT: 5432
      # Per-replica PostgreSQL budget. Five local workers remain below the
      # server's 100-connection ceiling even during simultaneous recovery.
      CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: ${CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS:-10}
      CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: ${CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS:-4}
      DOCREADER_ADDR: docreader:50051
      DOCREADER_TRANSPORT: grpc
      DOCREADER_GRPC_MAX_FILE_SIZE_MB: ${DOCREADER_GRPC_MAX_FILE_SIZE_MB:-50}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      MAX_KNOWLEDGE_SOURCE_FILE_SIZE_MB: ${MAX_KNOWLEDGE_SOURCE_FILE_SIZE_MB:-2048}
      CUSTOM_DOCUMENT_SPLIT_TARGET_RATIO: ${CUSTOM_DOCUMENT_SPLIT_TARGET_RATIO:-0.75}
      CUSTOM_DOCUMENT_SPLIT_WORKER_CONCURRENCY: ${CUSTOM_DOCUMENT_SPLIT_WORKER_CONCURRENCY:-4}
      CUSTOM_DOCUMENT_SPLIT_PER_DOCUMENT_WINDOW: ${CUSTOM_DOCUMENT_SPLIT_PER_DOCUMENT_WINDOW:-4}
      CUSTOM_DOCUMENT_SPLIT_LEASE_DURATION: ${CUSTOM_DOCUMENT_SPLIT_LEASE_DURATION:-2m}
      CUSTOM_DOCUMENT_SPLIT_TASK_TIMEOUT: ${CUSTOM_DOCUMENT_SPLIT_TASK_TIMEOUT:-30m}
      CUSTOM_DOCUMENT_SPLIT_RECOVERY_INTERVAL: ${CUSTOM_DOCUMENT_SPLIT_RECOVERY_INTERVAL:-10s}
      CUSTOM_DOCUMENT_SPLIT_RETRY_BACKOFF_BASE: ${CUSTOM_DOCUMENT_SPLIT_RETRY_BACKOFF_BASE:-30s}
      CUSTOM_DOCUMENT_SPLIT_RETRY_BACKOFF_MAX: ${CUSTOM_DOCUMENT_SPLIT_RETRY_BACKOFF_MAX:-5m}
      CUSTOM_DOCUMENT_SPLIT_MAX_RETRY: ${CUSTOM_DOCUMENT_SPLIT_MAX_RETRY:-6}
      CUSTOM_DOCUMENT_SPLIT_MAX_PARTS: ${CUSTOM_DOCUMENT_SPLIT_MAX_PARTS:-10000}
      CUSTOM_DOCUMENT_SPLIT_MAX_EXPANSION_RATIO: ${CUSTOM_DOCUMENT_SPLIT_MAX_EXPANSION_RATIO:-12}
      CUSTOM_DOCUMENT_SPLIT_QUESTION_STRATA: ${CUSTOM_DOCUMENT_SPLIT_QUESTION_STRATA:-256}
      CUSTOM_DOCUMENT_SPLIT_GRAPH_STRATA: ${CUSTOM_DOCUMENT_SPLIT_GRAPH_STRATA:-512}
      CUSTOM_DOCUMENT_SPLIT_TABLE_QUESTION_STRATA: ${CUSTOM_DOCUMENT_SPLIT_TABLE_QUESTION_STRATA:-64}
      CUSTOM_DOCUMENT_SPLIT_TABLE_GRAPH_STRATA: ${CUSTOM_DOCUMENT_SPLIT_TABLE_GRAPH_STRATA:-128}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
      REDIS_ADDR: redis:6379
      MILVUS_ADDRESS: milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_HOST: qdrant
      LOCAL_STORAGE_BASE_DIR: /workspace/.local-data/files
      DUCKDB_SKIP_EXTENSION_LOAD: "true"
      CUSTOM_DOCUMENT_QUEUE_INSTANCE_ID: ${CUSTOM_DOCUMENT_QUEUE_INSTANCE_ID:-weknora-app-dev}
      CUSTOM_DOCUMENT_QUEUE_TRUST_STABLE_INSTANCE_RESTART: "true"
      # DeepSeek V4 Flash completed 32/32 concurrent 160-token generations
      # (P95 5.655s) on 2026-07-26. Keep a 25% cluster headroom at 24; all
      # replicas must use identical values because leases are shared in Redis.
      CUSTOM_MODEL_ADMISSION_CHAT_CONCURRENCY: ${CUSTOM_MODEL_ADMISSION_CHAT_CONCURRENCY:-24}
      CUSTOM_MODEL_ADMISSION_CHAT_PER_TENANT: ${CUSTOM_MODEL_ADMISSION_CHAT_PER_TENANT:-12}
      CUSTOM_MODEL_ADMISSION_INTERACTIVE_RESERVE: ${CUSTOM_MODEL_ADMISSION_INTERACTIVE_RESERVE:-2}
      # Keep one failed LiteLLM upstream from pinning document derivative
      # slots for the multi-hour document workflow deadline.
      WEKNORA_LLM_CHAT_TIMEOUT_SECONDS: ${WEKNORA_LLM_CHAT_TIMEOUT_SECONDS:-240}
      WEKNORA_WIKI_MAP_TASK_CONCURRENCY: ${WEKNORA_WIKI_MAP_TASK_CONCURRENCY:-4}
      CGO_ENABLED: "1"
      CGO_CFLAGS: "-Wno-deprecated-declarations -Wno-gnu-folding-constant"
      WEKNORA_SANDBOX_MODE: ${WEKNORA_SANDBOX_MODE:-local}
      WEKNORA_SANDBOX_TIMEOUT: ${WEKNORA_SANDBOX_TIMEOUT:-300}
      CUSTOM_GENERAL_AGENT_URL: ${CUSTOM_GENERAL_AGENT_URL:-http://weknora-custom-general-agent:8091}
      CUSTOM_DOCUMENT_PROCESSING_AGENT_URL: ${CUSTOM_DOCUMENT_PROCESSING_AGENT_URL:-http://weknora-custom-document-processing-agent:8091}
      CUSTOM_GENERAL_AGENT_API_KEY: ${CUSTOM_GENERAL_AGENT_API_KEY:-dev-general-agent-key}
      CUSTOM_GENERAL_AGENT_HTTP_TIMEOUT_SEC: ${CUSTOM_GENERAL_AGENT_HTTP_TIMEOUT_SEC:-7200}
      CUSTOM_GENERAL_AGENT_TOOL_CALLBACK_URL: ${CUSTOM_GENERAL_AGENT_TOOL_CALLBACK_URL:-http://app-dev:8080/api/v1/custom/general-agent/internal/tools/call}
      CUSTOM_GENERAL_AGENT_ARTIFACT_UPLOAD_URL: ${CUSTOM_GENERAL_AGENT_ARTIFACT_UPLOAD_URL:-http://app-dev:8080/api/v1/custom/general-agent/internal/artifacts/upload}
      CUSTOM_GENERAL_AGENT_ARTIFACT_STORAGE_PROVIDER: ${CUSTOM_GENERAL_AGENT_ARTIFACT_STORAGE_PROVIDER:-minio}
      CUSTOM_GENERAL_AGENT_ARTIFACT_BUCKET: ${CUSTOM_GENERAL_AGENT_ARTIFACT_BUCKET:-weknora-original-inputs}
      CUSTOM_GENERAL_AGENT_ARTIFACT_PATH_PREFIX: ${CUSTOM_GENERAL_AGENT_ARTIFACT_PATH_PREFIX:-weknora/__weknora_private_agent_artifacts_v1__/deployment/dev-local/namespace/74b3d025-5a14-4a6d-b0fc-ff228d0ba98c/}
      # Four historical test rows already point at missing local files. Keep
      # missing/corrupt rows explicit; production stays fail-closed.
      CUSTOM_GENERAL_AGENT_ARTIFACT_MIGRATION_ALLOW_MISSING: ${CUSTOM_GENERAL_AGENT_ARTIFACT_MIGRATION_ALLOW_MISSING:-true}
      CUSTOM_GENERAL_AGENT_ARTIFACT_MIGRATION_ALLOW_INVALID: ${CUSTOM_GENERAL_AGENT_ARTIFACT_MIGRATION_ALLOW_INVALID:-true}
      CUSTOM_GENERAL_AGENT_ARTIFACT_ROOT: ${CUSTOM_GENERAL_AGENT_ARTIFACT_ROOT:-/workspace/.local-data/general-agent-artifacts}
      CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_STORAGE_PROVIDER: ${CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_STORAGE_PROVIDER:-minio}
      CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_BUCKET: ${CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_BUCKET:-weknora-original-inputs}
      CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_PATH_PREFIX: ${CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_PATH_PREFIX:-weknora/__weknora_claude_sdk_original_inputs_v1__/deployment/dev-local/namespace/74b3d025-5a14-4a6d-b0fc-ff228d0ba98c/}
      STORAGE_TYPE: ${DEV_STORAGE_TYPE:-minio}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-weknora-original-inputs}
      MINIO_PATH_PREFIX: ${MINIO_PATH_PREFIX:-weknora/__weknora_private_knowledge_objects_v1__/deployment/dev-local/namespace/74b3d025-5a14-4a6d-b0fc-ff228d0ba98c/}
      SSRF_WHITELIST_EXTRA: ${SSRF_WHITELIST_EXTRA:-searxng,qdrant,milvus,weaviate,doris-fe,host.docker.internal}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - go-mod-cache-dev:/go/pkg/mod
      - go-build-cache-dev:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      docreader:
        condition: service_healthy
    networks:
      - WeKnora-network-dev
    command: ["bash", "scripts/dev_app_docker.sh"]

  mobile-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.mobile
    image: weknora-mobile-web:local
    container_name: WeKnora-mobile-web
    environment:
      APP_SCHEME: http
      APP_HOST: app-dev
      APP_PORT: 8080
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      MAX_KNOWLEDGE_SOURCE_FILE_SIZE_MB: ${MAX_KNOWLEDGE_SOURCE_FILE_SIZE_MB:-2048}
    ports:
      - "${MOBILE_WEB_PORT:-18081}:80"
    depends_on:
      - app-dev
    networks:
      - WeKnora-network-dev

volumes:
  go-mod-cache-dev:
  go-build-cache-dev:
