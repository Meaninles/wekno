{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weknora.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 6 }}
  strategy:
    {{- toYaml .Values.app.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "weknora.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}
      {{- include "weknora.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "weknora.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.app.podSecurityContext | default .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "weknora.app.image" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Application settings
            # Stable for process/container restarts inside one pod. A replacement
            # pod intentionally gets a new identity and its expired work is stolen.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CUSTOM_DOCUMENT_QUEUE_INSTANCE_ID
              # A Pod UID survives an in-pod container restart but is never
              # reused by a replacement Pod. This makes same-ID boot adoption
              # an orchestrator-backed termination proof instead of a timeout.
              value: "k8s/$(POD_NAMESPACE)/$(POD_UID)"
            - name: CUSTOM_DOCUMENT_QUEUE_TRUST_STABLE_INSTANCE_RESTART
              value: "true"
            {{- if .Values.app.documentQueue.kubernetesRuntimeVerifier.enabled }}
            - name: CUSTOM_DOCUMENT_QUEUE_KUBERNETES_RUNTIME_VERIFIER_ENABLED
              value: "true"
            - name: CUSTOM_DOCUMENT_QUEUE_KUBERNETES_API_SERVER
              value: {{ .Values.app.documentQueue.kubernetesRuntimeVerifier.apiServer | quote }}
            - name: CUSTOM_DOCUMENT_QUEUE_KUBERNETES_CONTAINER_NAME
              value: {{ .Values.app.documentQueue.kubernetesRuntimeVerifier.containerName | quote }}
            - name: CUSTOM_DOCUMENT_QUEUE_KUBERNETES_REQUEST_TIMEOUT
              value: {{ .Values.app.documentQueue.kubernetesRuntimeVerifier.requestTimeout | quote }}
            - name: CUSTOM_DOCUMENT_QUEUE_KUBERNETES_TOKEN_FILE
              value: /var/run/secrets/weknora-document-queue-kubernetes/token
            - name: CUSTOM_DOCUMENT_QUEUE_KUBERNETES_CA_FILE
              value: /var/run/secrets/weknora-document-queue-kubernetes/ca.crt
            {{- end }}
            - name: GIN_MODE
              value: {{ .Values.app.env.GIN_MODE | quote }}
            - name: AUTO_MIGRATE
              value: {{ .Values.app.env.AUTO_MIGRATE | quote }}
            - name: TZ
              value: {{ .Values.app.env.TZ | quote }}
            # Database configuration
            - name: DB_DRIVER
              value: "postgres"
            - name: DB_HOST
              value: {{ .Values.app.connections.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.app.connections.database.port | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: DB_NAME
            - name: DB_SSLMODE
              value: {{ .Values.app.connections.database.ssl.mode | quote }}
            - name: DB_SSLROOTCERT
              value: {{ .Values.app.connections.database.ssl.rootCertFile | quote }}
            - name: DB_SSLCERT
              value: {{ .Values.app.connections.database.ssl.certFile | quote }}
            - name: DB_SSLKEY
              value: {{ .Values.app.connections.database.ssl.keyFile | quote }}
            # Redis configuration
            - name: REDIS_ADDR
              value: {{ .Values.app.connections.redis.address | quote }}
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: REDIS_USERNAME
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              value: {{ .Values.app.connections.redis.db | quote }}
            - name: REDIS_PREFIX
              value: {{ .Values.app.connections.redis.prefix | quote }}
            - name: REDIS_TLS_ENABLED
              value: {{ .Values.app.connections.redis.tls.enabled | quote }}
            - name: REDIS_TLS_CA_FILE
              value: {{ .Values.app.connections.redis.tls.caFile | quote }}
            - name: REDIS_TLS_CERT_FILE
              value: {{ .Values.app.connections.redis.tls.certFile | quote }}
            - name: REDIS_TLS_KEY_FILE
              value: {{ .Values.app.connections.redis.tls.keyFile | quote }}
            - name: REDIS_TLS_SERVER_NAME
              value: {{ .Values.app.connections.redis.tls.serverName | quote }}
            - name: REDIS_TLS_INSECURE_SKIP_VERIFY
              value: {{ .Values.app.connections.redis.tls.insecureSkipVerify | quote }}
            - name: STREAM_MANAGER_TYPE
              value: {{ .Values.app.env.STREAM_MANAGER_TYPE | quote }}
            # Security
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: JWT_SECRET
            - name: TENANT_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: TENANT_AES_KEY
            - name: SYSTEM_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: SYSTEM_AES_KEY
            # Retrieval & Storage
            - name: RETRIEVE_DRIVER
              value: {{ .Values.app.env.RETRIEVE_DRIVER | quote }}
            - name: STORAGE_TYPE
              value: {{ .Values.app.env.STORAGE_TYPE | quote }}
            - name: LOCAL_STORAGE_BASE_DIR
              value: {{ .Values.app.env.LOCAL_STORAGE_BASE_DIR | quote }}
            # Document reader
            - name: DOCREADER_ADDR
              value: {{ .Values.app.connections.docreader.address | quote }}
            # Processing
            - name: AUTO_RECOVER_DIRTY
              value: {{ .Values.app.env.AUTO_RECOVER_DIRTY | quote }}
            - name: CONCURRENCY_POOL_SIZE
              value: {{ .Values.app.env.CONCURRENCY_POOL_SIZE | quote }}
            - name: WEKNORA_ASYNQ_CONCURRENCY
              value: {{ .Values.app.env.WEKNORA_ASYNQ_CONCURRENCY | quote }}
            - name: CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS
              value: {{ .Values.app.env.CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS | quote }}
            - name: CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS
              value: {{ .Values.app.env.CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS | quote }}
            - name: WEKNORA_WIKI_MAP_TASK_CONCURRENCY
              value: {{ .Values.app.env.WEKNORA_WIKI_MAP_TASK_CONCURRENCY | quote }}
            - name: ENABLE_GRAPH_RAG
              value: {{ .Values.app.env.ENABLE_GRAPH_RAG | quote }}
            - name: WEKNORA_SANDBOX_MODE
              value: {{ .Values.app.sandbox.mode | quote }}
            - name: WEKNORA_SANDBOX_TIMEOUT
              value: {{ .Values.app.sandbox.timeoutSeconds | quote }}
            - name: WEKNORA_SANDBOX_DOCKER_IMAGE
              value: {{ .Values.app.sandbox.dockerImage | quote }}
            - name: NEO4J_ENABLE
              value: {{ ternary "true" "false" (or .Values.neo4j.enabled (eq (lower (toString .Values.app.env.ENABLE_GRAPH_RAG)) "true")) | quote }}
            - name: WEKNORA_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.app.agentIntegration.enabled }}
            # All Agent Pods are disposable. Final deliverables are committed
            # to this app's private object store before the run completes.
            - name: CUSTOM_GENERAL_AGENT_URL
              value: {{ .Values.app.agentIntegration.generalAgentURL | quote }}
            - name: CUSTOM_DOCUMENT_PROCESSING_AGENT_URL
              value: {{ .Values.app.agentIntegration.documentProcessingAgentURL | quote }}
            - name: CUSTOM_GENERAL_AGENT_TOOL_CALLBACK_URL
              value: {{ .Values.app.agentIntegration.toolCallbackURL | quote }}
            - name: CUSTOM_GENERAL_AGENT_ARTIFACT_UPLOAD_URL
              value: {{ .Values.app.agentIntegration.artifactUploadURL | quote }}
            - name: CUSTOM_GENERAL_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.agentIntegration.apiKeySecret.name | quote }}
                  key: {{ .Values.app.agentIntegration.apiKeySecret.key | quote }}
            - name: CUSTOM_GENERAL_AGENT_ARTIFACT_STORAGE_PROVIDER
              value: {{ .Values.app.agentIntegration.artifactStorage.provider | quote }}
            - name: CUSTOM_GENERAL_AGENT_ARTIFACT_BUCKET
              value: {{ .Values.app.agentIntegration.artifactStorage.bucket | quote }}
            - name: CUSTOM_GENERAL_AGENT_ARTIFACT_PATH_PREFIX
              value: {{ .Values.app.agentIntegration.artifactStorage.pathPrefix | quote }}
            - name: CUSTOM_GENERAL_AGENT_ARTIFACT_MIGRATION_ALLOW_MISSING
              value: {{ .Values.app.agentIntegration.artifactStorage.migrationAllowMissing | quote }}
            - name: CUSTOM_GENERAL_AGENT_ARTIFACT_MIGRATION_ALLOW_INVALID
              value: {{ .Values.app.agentIntegration.artifactStorage.migrationAllowInvalid | quote }}
            {{- end }}
            {{- if or .Values.neo4j.enabled (eq (lower (toString .Values.app.env.ENABLE_GRAPH_RAG)) "true") }}
            # Neo4j configuration (for GraphRAG)
            - name: NEO4J_URI
              value: {{ .Values.app.connections.neo4j.uri | quote }}
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: NEO4J_USERNAME
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: NEO4J_PASSWORD
            {{- end }}
            {{- with .Values.app.extraEnv }}
            # Additional environment variables
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data-files
              mountPath: /data/files
            - name: scratch
              mountPath: /tmp
            {{- if .Values.app.documentQueue.kubernetesRuntimeVerifier.enabled }}
            - name: document-queue-kubernetes-api
              mountPath: /var/run/secrets/weknora-document-queue-kubernetes
              readOnly: true
            {{- end }}
            {{- with .Values.app.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          {{- with .Values.app.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data-files
          {{- if .Values.dataFiles.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.dataFiles.persistence.existingClaim | default (printf "%s-data-files" (include "weknora.fullname" .)) }}
          {{- else }}
          emptyDir:
            {{- with .Values.dataFiles.emptyDir.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
          {{- end }}
        - name: scratch
          {{- if eq (.Values.app.scratch.volumeType | default "emptyDir") "ephemeral" }}
          ephemeral:
            volumeClaimTemplate:
              {{- with .Values.app.scratch.ephemeral.annotations }}
              metadata:
                annotations:
                  {{- toYaml . | nindent 18 }}
              {{- end }}
              spec:
                accessModes:
                  {{- toYaml .Values.app.scratch.ephemeral.accessModes | nindent 18 }}
                {{- with .Values.app.scratch.ephemeral.storageClassName }}
                storageClassName: {{ . | quote }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ .Values.app.scratch.ephemeral.size }}
          {{- else }}
          emptyDir:
            {{- with .Values.app.scratch.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
          {{- end }}
        {{- if .Values.app.documentQueue.kubernetesRuntimeVerifier.enabled }}
        - name: document-queue-kubernetes-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.app.documentQueue.kubernetesRuntimeVerifier.tokenExpirationSeconds }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
        {{- with .Values.app.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.app.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.app.topologySpread.maxSkew }}
          topologyKey: {{ .Values.app.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.app.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "weknora.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 14 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Service name must be "app" - frontend nginx config hardcodes this
  name: app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
  {{- with .Values.app.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "weknora.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
