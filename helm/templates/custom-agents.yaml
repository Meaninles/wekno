{{/*
Copyright 2025 Tencent
SPDX-License-Identifier: MIT

The two Agent pools are stateless. Each run stays inside one Pod-local
workspace, while every final artifact is uploaded to the app's private object
store before the terminal event is emitted.
*/}}
{{- if .Values.generalAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weknora.fullname" . }}-general-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "general-agent" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.generalAgent.replicaCount }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "general-agent" "context" .) | nindent 6 }}
  strategy:
    {{- toYaml .Values.generalAgent.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "weknora.componentSelectorLabels" (dict "component" "general-agent" "context" .) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.generalAgent.terminationGracePeriodSeconds }}
      {{- include "weknora.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "weknora.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: general-agent
          image: {{ include "weknora.generalAgent.image" . }}
          imagePullPolicy: {{ .Values.generalAgent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: PORT
              value: "8091"
            - name: CUSTOM_GENERAL_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.generalAgent.apiKeySecret.name | quote }}
                  key: {{ .Values.generalAgent.apiKeySecret.key | quote }}
            - name: CUSTOM_GENERAL_AGENT_CLAUDE_API_TIMEOUT_MS
              value: {{ .Values.generalAgent.env.apiTimeoutMS | quote }}
            - name: CUSTOM_GENERAL_AGENT_CLAUDE_IDLE_TIMEOUT_MS
              value: {{ .Values.generalAgent.env.idleTimeoutMS | quote }}
            - name: CUSTOM_GENERAL_AGENT_MAX_TURNS
              value: {{ .Values.generalAgent.env.maxTurns | quote }}
            - name: CUSTOM_GENERAL_AGENT_MAX_ARTIFACT_MB
              value: {{ .Values.generalAgent.env.maxArtifactMB | quote }}
            - name: GENERAL_AGENT_RUN_ROOT
              value: /tmp/weknora-general-agent-runs
            {{- with .Values.generalAgent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: run-workspace
              mountPath: /tmp/weknora-general-agent-runs
          resources:
            {{- toYaml .Values.generalAgent.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: run-workspace
          {{- if eq (.Values.generalAgent.scratch.volumeType | default "emptyDir") "ephemeral" }}
          ephemeral:
            volumeClaimTemplate:
              {{- with .Values.generalAgent.scratch.ephemeral.annotations }}
              metadata:
                annotations:
                  {{- toYaml . | nindent 18 }}
              {{- end }}
              spec:
                accessModes:
                  {{- toYaml .Values.generalAgent.scratch.ephemeral.accessModes | nindent 18 }}
                {{- with .Values.generalAgent.scratch.ephemeral.storageClassName }}
                storageClassName: {{ . | quote }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ .Values.generalAgent.scratch.ephemeral.size }}
          {{- else if eq (.Values.generalAgent.scratch.volumeType | default "emptyDir") "hostPath" }}
          hostPath:
            path: {{ .Values.generalAgent.scratch.hostPath.path | default "/mnt/weknora-data/scratch-general-agent" | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir:
            {{- with .Values.generalAgent.scratch.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
          {{- end }}
      {{- with .Values.generalAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.generalAgent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.generalAgent.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.generalAgent.topologySpread.maxSkew }}
          topologyKey: {{ .Values.generalAgent.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.generalAgent.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "weknora.componentSelectorLabels" (dict "component" "general-agent" "context" .) | nindent 14 }}
      {{- end }}
      {{- with .Values.generalAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-custom-general-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "general-agent" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.generalAgent.service.type }}
  selector:
    {{- include "weknora.componentSelectorLabels" (dict "component" "general-agent" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.generalAgent.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.generalAgent.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "weknora.fullname" . }}-general-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "general-agent" "context" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.generalAgent.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "general-agent" "context" .) | nindent 6 }}
{{- end }}
{{- end }}

