{{- if .Values.docreader.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weknora.fullname" . }}-docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  {{- if not .Values.docreader.autoscaling.enabled }}
  replicas: {{ .Values.docreader.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 6 }}
  strategy:
    {{- toYaml .Values.docreader.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.docreader.terminationGracePeriodSeconds }}
      {{- include "weknora.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "weknora.serviceAccountName" . }}
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: docreader
          image: {{ include "weknora.docreader.image" . }}
          imagePullPolicy: {{ .Values.docreader.image.pullPolicy }}
          {{- with .Values.docreader.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
            - containerPort: {{ .Values.docreader.healthPort }}
              name: health-grpc
              protocol: TCP
          env:
            - name: STORAGE_TYPE
              value: {{ .Values.docreader.env.STORAGE_TYPE | quote }}
            - name: DOCREADER_HEALTH_GRPC_PORT
              value: {{ .Values.docreader.healthPort | quote }}
            {{- with .Values.docreader.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          resources:
            {{- toYaml .Values.docreader.resources | nindent 12 }}
          {{- with .Values.docreader.startupProbe }}
          startupProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=127.0.0.1:{{ $.Values.docreader.healthPort }}
                - -connect-timeout=1s
                - -rpc-timeout=5s
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # gRPC health check using grpc_health_probe
          livenessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=127.0.0.1:{{ .Values.docreader.healthPort }}
                - -connect-timeout=1s
                - -rpc-timeout=5s
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - grpc_health_probe
                # Readiness checks the real parser gRPC executor. Liveness
                # remains on the isolated health port so legitimate long
                # parses do not cause a restart loop.
                - -addr=127.0.0.1:50051
                - -connect-timeout=1s
                - -rpc-timeout=5s
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: scratch
          {{- if eq (.Values.docreader.scratch.volumeType | default "emptyDir") "ephemeral" }}
          ephemeral:
            volumeClaimTemplate:
              {{- with .Values.docreader.scratch.ephemeral.annotations }}
              metadata:
                annotations:
                  {{- toYaml . | nindent 18 }}
              {{- end }}
              spec:
                accessModes:
                  {{- toYaml .Values.docreader.scratch.ephemeral.accessModes | nindent 18 }}
                {{- with .Values.docreader.scratch.ephemeral.storageClassName }}
                storageClassName: {{ . | quote }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ .Values.docreader.scratch.ephemeral.size }}
          {{- else if eq (.Values.docreader.scratch.volumeType | default "emptyDir") "hostPath" }}
          hostPath:
            path: {{ .Values.docreader.scratch.hostPath.path | default "/mnt/weknora-data/scratch-docreader" | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir:
            {{- with .Values.docreader.scratch.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
          {{- end }}
      {{- with .Values.docreader.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docreader.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.docreader.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.docreader.topologySpread.maxSkew }}
          topologyKey: {{ .Values.docreader.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.docreader.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 14 }}
      {{- end }}
      {{- with .Values.docreader.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Service name must be "docreader" - app references this
  name: docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.docreader.service.type }}
  {{- if .Values.docreader.service.headless }}
  clusterIP: None
  publishNotReadyAddresses: false
  {{- end }}
  selector:
    {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.docreader.service.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
