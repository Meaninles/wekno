{{/*
Copyright 2025 Tencent
SPDX-License-Identifier: MIT

Horizontal scaling for the two stateless document-processing tiers. The app
owns complete durable workflows; DocReader is a headless round-robin parser
pool. Conservative scale-down avoids needless lease transfers for long files.
*/}}
{{- if and .Values.app.enabled .Values.app.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "weknora.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "weknora.fullname" . }}-app
  minReplicas: {{ .Values.app.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.autoscaling.maxReplicas }}
  behavior:
    {{- toYaml .Values.app.autoscaling.behavior | nindent 4 }}
  metrics:
    {{- with .Values.app.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.app.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
---
{{- end }}
{{- if and .Values.docreader.enabled .Values.docreader.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "weknora.fullname" . }}-docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "weknora.fullname" . }}-docreader
  minReplicas: {{ .Values.docreader.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.docreader.autoscaling.maxReplicas }}
  behavior:
    {{- toYaml .Values.docreader.autoscaling.behavior | nindent 4 }}
  metrics:
    {{- with .Values.docreader.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.docreader.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
