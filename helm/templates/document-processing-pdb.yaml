{{/* Keep complete document workers and parser backends available during voluntary disruptions. */}}
{{- if and .Values.app.enabled .Values.app.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "weknora.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.app.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 6 }}
---
{{- end }}
{{- if and .Values.docreader.enabled .Values.docreader.podDisruptionBudget.enabled (not (and .Values.app.runtimeRoles.enabled .Values.app.runtimeRoles.startSuspended)) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "weknora.fullname" . }}-docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.docreader.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 6 }}
{{- end }}
{{- if and .Values.frontend.enabled .Values.frontend.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "weknora.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "frontend" "context" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.frontend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "frontend" "context" .) | nindent 6 }}
{{- end }}
{{- if and .Values.mobileWeb.enabled .Values.mobileWeb.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "weknora.fullname" . }}-mobile-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "mobile-web" "context" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.mobileWeb.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "mobile-web" "context" .) | nindent 6 }}
{{- end }}
