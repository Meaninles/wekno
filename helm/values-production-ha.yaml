# WeKnora production profile for the existing Moutai CCE cluster.
#
# This is the target production topology, not a staged rollout profile.
# It assumes the prerequisites documented in
# docs/custom/生产集群无RWX最优部署方案.md have been completed:
#   - immutable release images are available on every eligible node (SWR is
#     preferred; until push access exists, preload the exact same digest);
#   - .1/.2/.7 have an Everest local-PV pool backed by their data disks and
#     the csi-local-topology StorageClass has been verified;
#   - the node labels used below exist;
#   - weknora-agent-internal contains apiKey;
#   - historical /data/files and Agent artifacts have passed the object-store
#     migration audit.
#
# No RWX storage is used. Durable files go to private OBS; parsing and Agent
# workspaces use isolated per-Pod local RWO volumes and may be discarded.

global:
  imagePullSecrets:
    - name: default-secret

serviceAccount:
  create: true
  automountServiceAccountToken: false

app:
  enabled: true
  replicaCount: 3
  autoscaling:
    enabled: false
  terminationGracePeriodSeconds: 180
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  nodeSelector:
    weknora.io/document-worker: "true"
  image:
    # Mirror this repository to the approved SWR project when push access is
    # granted. The tag must identify the image built from this code state.
    repository: weknora-app-prod
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  resources:
    # Test baseline: three cap=4 workers processed 500/500 documents at
    # ~4.10 docs/s. This request leaves ~3 CPU and ~18 GiB request headroom
    # on each 8C/32G parsing node while allowing burst CPU to DocReader.
    requests:
      cpu: 1500m
      memory: 3Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi
      ephemeral-storage: 8Gi
  scratch:
    volumeType: ephemeral
    ephemeral:
      storageClassName: csi-local-topology
      size: 80Gi
      accessModes:
        - ReadWriteOnce
      annotations:
        everest.io/csi.volume-name-prefix: wk-app-tmp
  env:
    GIN_MODE: release
    RETRIEVE_DRIVER: postgres
    STORAGE_TYPE: obs
    LOCAL_STORAGE_BASE_DIR: /data/files
    AUTO_RECOVER_DIRTY: "false"
    STREAM_MANAGER_TYPE: redis
    CONCURRENCY_POOL_SIZE: "8"
    # Complete document workflows per app instance. The system-admin
    # asynq.concurrency setting is authoritative at runtime.
    WEKNORA_ASYNQ_CONCURRENCY: "4"
    CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "8"
    CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "2"
    WEKNORA_WIKI_MAP_TASK_CONCURRENCY: "4"
    ENABLE_GRAPH_RAG: "true"
    TZ: Asia/Shanghai
  connections:
    # PostgreSQL/Neo4j remain the existing separately managed stateful
    # deployments. Their current Services are reused by this chart.
    database:
      host: postgres.weknora.svc.cluster.local
      port: "5432"
      ssl:
        mode: disable
        rootCertFile: ""
        certFile: ""
        keyFile: ""
    redis:
      address: redis.weknora.svc.cluster.local:6379
      db: "0"
      prefix: "stream:"
      tls:
        enabled: false
        caFile: ""
        certFile: ""
        keyFile: ""
        serverName: ""
        insecureSkipVerify: false
    docreader:
      address: docreader.weknora.svc.cluster.local:50051
    neo4j:
      uri: bolt://neo4j.weknora.svc.cluster.local:7687
  documentQueue:
    kubernetesRuntimeVerifier:
      enabled: true
      apiServer: https://kubernetes.default.svc
      containerName: app
      requestTimeout: 5s
      tokenExpirationSeconds: 3600
  agentIntegration:
    enabled: true
    generalAgentURL: http://weknora-custom-general-agent.weknora.svc.cluster.local:8091
    documentProcessingAgentURL: http://weknora-custom-document-processing-agent.weknora.svc.cluster.local:8091
    toolCallbackURL: http://app.weknora.svc.cluster.local:8080/api/v1/custom/general-agent/internal/tools/call
    artifactUploadURL: http://app.weknora.svc.cluster.local:8080/api/v1/custom/general-agent/internal/artifacts/upload
    apiKeySecret:
      name: weknora-agent-internal
      key: apiKey
    artifactStorage:
      provider: obs
      bucket: ap-weknora-obs-zhengshi-01
      # This UUID is this production deployment's durable namespace identity.
      # Never reuse it for a test cluster or restore drill and never rotate it
      # during an ordinary upgrade.
      pathPrefix: weknora/__weknora_private_agent_artifacts_v1__/deployment/prod-cce-wk-6a9d12b0/namespace/6a9d12b0-48d2-46b4-9e40-1a407860838d/
      migrationAllowMissing: "false"
      migrationAllowInvalid: "false"
  extraEnv:
    # Ordinary knowledge files and generated private artifacts share the OBS
    # account but use disjoint, auditable prefixes.
    - name: OBS_ENDPOINT
      value: http://10.8.32.252
    - name: OBS_REGION
      value: us-east-1
    - name: OBS_BUCKET_NAME
      value: ap-weknora-obs-zhengshi-01
    - name: OBS_PATH_PREFIX
      value: weknora/__weknora_private_knowledge_objects_v1__/deployment/prod-cce-wk-6a9d12b0/namespace/6a9d12b0-48d2-46b4-9e40-1a407860838d/
    - name: OBS_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: weknora-obs
          key: OBS_ACCESS_KEY
    - name: OBS_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: weknora-obs
          key: OBS_SECRET_KEY
    - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_STORAGE_PROVIDER
      value: obs
    - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_BUCKET
      value: ap-weknora-obs-zhengshi-01
    - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_PATH_PREFIX
      value: weknora/__weknora_claude_sdk_original_inputs_v1__/deployment/prod-cce-wk-6a9d12b0/namespace/6a9d12b0-48d2-46b4-9e40-1a407860838d/
      # Leaf keys are temp/<tenant-id>/<transfer-uuid>.<ext>. Configure an OBS
      # lifecycle rule scoped exactly to this prefix with <=24h expiration as
      # a hard-kill fallback; never include knowledge or artifact prefixes.
    - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_MAX_MB
      value: "50"
    - name: CUSTOM_GENERAL_AGENT_ARTIFACT_UPLOAD_MAX_MB
      value: "128"

    # Uploads larger than the 50 MiB parser transport ceiling are split before
    # DocReader. The public knowledge-source ceiling remains 2 GiB.
    - name: MAX_FILE_SIZE_MB
      value: "50"
    - name: MAX_KNOWLEDGE_SOURCE_FILE_SIZE_MB
      value: "2048"
    - name: DOCREADER_GRPC_MAX_FILE_SIZE_MB
      value: "50"
    - name: CUSTOM_DOCUMENT_SPLIT_TARGET_RATIO
      value: "0.75"
    - name: CUSTOM_DOCUMENT_SPLIT_WORKER_CONCURRENCY
      value: "4"
    - name: CUSTOM_DOCUMENT_SPLIT_PER_DOCUMENT_WINDOW
      value: "4"
    - name: CUSTOM_DOCUMENT_SPLIT_LEASE_DURATION
      value: 2m
    - name: CUSTOM_DOCUMENT_SPLIT_TASK_TIMEOUT
      value: 30m
    - name: CUSTOM_DOCUMENT_SPLIT_RECOVERY_INTERVAL
      value: 10s
    - name: CUSTOM_DOCUMENT_SPLIT_RETRY_BACKOFF_BASE
      value: 30s
    - name: CUSTOM_DOCUMENT_SPLIT_RETRY_BACKOFF_MAX
      value: 5m
    - name: CUSTOM_DOCUMENT_SPLIT_MAX_RETRY
      value: "6"
    - name: CUSTOM_DOCUMENT_SPLIT_MAX_PARTS
      value: "10000"
    - name: CUSTOM_DOCUMENT_SPLIT_MAX_EXPANSION_RATIO
      value: "12"
    - name: CUSTOM_DOCUMENT_SPLIT_QUESTION_STRATA
      value: "256"
    - name: CUSTOM_DOCUMENT_SPLIT_GRAPH_STRATA
      value: "512"
    - name: CUSTOM_DOCUMENT_SPLIT_TABLE_QUESTION_STRATA
      value: "64"
    - name: CUSTOM_DOCUMENT_SPLIT_TABLE_GRAPH_STRATA
      value: "128"
    - name: CUSTOM_DOCUMENT_SPLIT_OFFICE_TIMEOUT_SECONDS
      value: "1800"
    - name: CUSTOM_DOCUMENT_SPLIT_AUDIO_TIMEOUT_SECONDS
      value: "1800"

    # Root-document ownership is durable in PostgreSQL. Heartbeats are only
    # suspicion; takeover also requires lease/boot fencing and, where
    # available, an exact Kubernetes termination proof.
    - name: CUSTOM_DOCUMENT_QUEUE_HEARTBEAT_INTERVAL
      value: 10s
    - name: CUSTOM_DOCUMENT_QUEUE_LEASE_DURATION
      value: 90s
    - name: CUSTOM_DOCUMENT_QUEUE_RECOVERY_INTERVAL
      value: 10s
    - name: CUSTOM_DOCUMENT_QUEUE_INSTANCE_STALE_AFTER
      value: 35s
    - name: CUSTOM_DOCUMENT_QUEUE_POLL_INTERVAL
      value: 2s
    - name: CUSTOM_DOCUMENT_QUEUE_SHUTDOWN_DRAIN_TIMEOUT
      value: 120s
    - name: CUSTOM_DOCUMENT_QUEUE_WORKFLOW_TIMEOUT
      value: 48h
    - name: WEKNORA_ASYNQ_TASK_CONCURRENCY
      value: "16"
    - name: WEKNORA_LLM_CHAT_TIMEOUT_SECONDS
      value: "240"

    # Shared Redis leases make these cluster-wide limits; they must not be
    # multiplied by the number of app replicas. The chat ceiling is based on
    # the observed sharp latency cliff above 18 concurrent calls.
    - name: CUSTOM_MODEL_ADMISSION_ENABLED
      value: "true"
    - name: CUSTOM_MODEL_ADMISSION_FAIL_CLOSED
      value: "true"
    - name: CUSTOM_MODEL_ADMISSION_KEY_PREFIX
      value: "weknora:prod-cce-wk-6a9d12b0:model-admission:v1:"
    - name: CUSTOM_MODEL_ADMISSION_CHAT_CONCURRENCY
      value: "18"
    - name: CUSTOM_MODEL_ADMISSION_CHAT_PER_TENANT
      value: "9"
    - name: CUSTOM_MODEL_ADMISSION_INTERACTIVE_RESERVE
      value: "2"
    - name: CUSTOM_MODEL_ADMISSION_EMBEDDING_CONCURRENCY
      value: "32"
    - name: CUSTOM_MODEL_ADMISSION_EMBEDDING_PER_TENANT
      value: "16"
    - name: CUSTOM_MODEL_ADMISSION_RERANK_CONCURRENCY
      value: "24"
    - name: CUSTOM_MODEL_ADMISSION_RERANK_PER_TENANT
      value: "12"
    - name: CUSTOM_MODEL_ADMISSION_VLM_CONCURRENCY
      value: "4"
    - name: CUSTOM_MODEL_ADMISSION_VLM_PER_TENANT
      value: "2"
    - name: CUSTOM_MODEL_ADMISSION_ASR_CONCURRENCY
      value: "2"
    - name: CUSTOM_MODEL_ADMISSION_ASR_PER_TENANT
      value: "1"
    - name: CUSTOM_MODEL_ADMISSION_PARSER_CONCURRENCY
      value: "12"
    - name: CUSTOM_MODEL_ADMISSION_PARSER_PER_TENANT
      value: "4"

    # Keep the existing Docker sandbox feature available on every app node.
    # Runs are one-shot (`docker run --rm`), so no session affinity is needed.
    - name: WEKNORA_SANDBOX_MODE
      value: docker
    - name: WEKNORA_SANDBOX_TIMEOUT
      value: "300"
    - name: WEKNORA_SANDBOX_DOCKER_IMAGE
      value: weknora-sandbox-prod:v0.6.3
    - name: SSRF_WHITELIST_EXTRA
      value: 10.0.11.36,10.0.11.37,weknora-litellm,weixin.moutai.com
  extraVolumes:
    - name: docker-socket
      hostPath:
        path: /var/run/docker.sock
        type: Socket
    - name: sandbox-skills
      hostPath:
        path: /app/skills/preloaded
        type: Directory
  extraVolumeMounts:
    - name: docker-socket
      mountPath: /var/run/docker.sock
    - name: sandbox-skills
      mountPath: /app/skills/preloaded
      readOnly: true

docreader:
  enabled: true
  replicaCount: 3
  autoscaling:
    enabled: false
  terminationGracePeriodSeconds: 90
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  nodeSelector:
    weknora.io/document-worker: "true"
  image:
    repository: wechatopenai/weknora-docreader
    tag: v0.6.3-40e8ab8
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 1500m
      memory: 3Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: "6"
      memory: 10Gi
      ephemeral-storage: 4Gi
  scratch:
    volumeType: ephemeral
    ephemeral:
      storageClassName: csi-local-topology
      size: 100Gi
      accessModes:
        - ReadWriteOnce
      annotations:
        everest.io/csi.volume-name-prefix: wk-parser-tmp
  service:
    type: ClusterIP
    port: 50051
    headless: true
  extraEnv:
    - name: DOCREADER_GRPC_MAX_WORKERS
      value: "4"
    - name: DOCREADER_GRPC_MAX_FILE_SIZE_MB
      value: "50"
    - name: DOCREADER_PDF_RENDER_PARALLELISM
      value: "2"
    - name: DOCREADER_PDF_RENDER_MAX_WORKERS
      value: "1"
    - name: DOCREADER_MARKITDOWN_MAX_WORKERS
      value: "1"
    - name: DOCREADER_ODL_MAX_WORKERS
      value: "1"
    - name: DOCREADER_ODL_HYBRID
      value: "off"

generalAgent:
  enabled: true
  replicaCount: 2
  terminationGracePeriodSeconds: 60
  image:
    repository: weknora-custom-general-agent
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  apiKeySecret:
    name: weknora-agent-internal
    key: apiKey
  env:
    maxTurns: "30"
    maxArtifactMB: "50"
    apiTimeoutMS: "7200000"
    idleTimeoutMS: "900000"
  scratch:
    volumeType: ephemeral
    ephemeral:
      storageClassName: csi-local-topology
      size: 20Gi
      accessModes:
        - ReadWriteOnce
      annotations:
        everest.io/csi.volume-name-prefix: wk-agent-tmp
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector:
    weknora.io/agent-worker: "true"

documentProcessingAgent:
  enabled: true
  replicaCount: 2
  terminationGracePeriodSeconds: 90
  image:
    repository: weknora-custom-document-processing-agent
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  apiKeySecret:
    name: weknora-agent-internal
    key: apiKey
  env:
    maxTurns: "30"
    maxArtifactMB: "50"
    apiTimeoutMS: "7200000"
    idleTimeoutMS: "900000"
  scratch:
    volumeType: ephemeral
    ephemeral:
      storageClassName: csi-local-topology
      size: 40Gi
      accessModes:
        - ReadWriteOnce
      annotations:
        everest.io/csi.volume-name-prefix: wk-doc-agent-tmp
  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      cpu: "3"
      memory: 4Gi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector:
    weknora.io/agent-worker: "true"

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: weknora-ui-prod
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  maxFileSizeMB: "50"
  maxKnowledgeSourceFileSizeMB: "2048"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector:
    weknora.io/stateless-worker: "true"

mobileWeb:
  enabled: true
  replicaCount: 2
  image:
    repository: weknora-mobile-web
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  maxFileSizeMB: "50"
  maxKnowledgeSourceFileSizeMB: "2048"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 512Mi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector:
    weknora.io/stateless-worker: "true"

# /data/files is compatibility-only scratch after the verified migration.
# It must stay nearly empty; all durable files are in OBS.
dataFiles:
  emptyDir:
    sizeLimit: 1Gi
  persistence:
    enabled: false

# Existing stateful services remain independently managed. They are still
# single points and are explicitly called out in the deployment document.
postgresql:
  enabled: false
redis:
  enabled: false
neo4j:
  enabled: false
minio:
  enabled: false

secrets:
  existingSecret: weknora-secrets

metrics:
  enabled: true
  serviceMonitor:
    enabled: false

ingress:
  enabled: true
  className: nginx-ingress
  host: knora.moutai.com.cn
  tls:
    enabled: false
    secretName: ""
  annotations:
    # Public knowledge-source upload ceiling. Every cloud ELB/reverse-proxy hop
    # must be >=2 GiB too. If an internal proxy is later inserted in front of
    # an Agent service, its separate body limit is 128 MiB.
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "7200"
