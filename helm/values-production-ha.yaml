frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: weknora-ui-prod
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  maxFileSizeMB: "50"
  maxKnowledgeSourceFileSizeMB: "2048"
  proxyMaxBodySizeMB: "80"
  proxyMaxKnowledgeSourceBodySizeMB: "2304"
  proxyTimeoutSeconds: "7200"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector:
    weknora.io/stateless-worker: "true"

mobileWeb:
  enabled: true
  replicaCount: 2
  image:
    repository: weknora-mobile-web
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  maxFileSizeMB: "50"
  maxKnowledgeSourceFileSizeMB: "2048"
  proxyMaxBodySizeMB: "80"
  proxyMaxKnowledgeSourceBodySizeMB: "2304"
  proxyTimeoutSeconds: "7200"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 512Mi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector:
    weknora.io/stateless-worker: "true"

# /data/files is compatibility-only scratch after the verified migration.
# It must stay nearly empty; all durable files are in OBS.
dataFiles:
  emptyDir:
    sizeLimit: 1Gi
  persistence:
    enabled: false

# Existing stateful services remain independently managed. They are still
# single points and are explicitly called out in the deployment document.
postgresql:
  enabled: false
redis:
  enabled: false
neo4j:
  enabled: false
minio:
  enabled: false

secrets:
  existingSecret: weknora-secrets

metrics:
  enabled: true
  serviceMonitor:
    enabled: false

ingress:
  enabled: true
  className: nginx-ingress
  host: knora.moutai.com.cn
  tls:
    enabled: false
    secretName: ""
  annotations:
    # 2304 MiB leaves framing headroom above the exact 2 GiB raw knowledge-file
    # limit. Backend validation remains authoritative. An internal proxy placed
    # in front of an Agent service still needs at least 128 MiB.
    nginx.ingress.kubernetes.io/proxy-body-size: "2304m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "7200"
