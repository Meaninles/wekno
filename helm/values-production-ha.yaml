  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  image:
    repository: weknora-custom-general-agent
    digest: ""
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  apiKeySecret:
    name: weknora-agent-internal
    key: apiKey
  env:
    maxTurns: "30"
    maxArtifactMB: "50"
    apiTimeoutMS: "7200000"
    idleTimeoutMS: "900000"
  scratch:
    volumeType: hostPath
    hostPath:
      path: /mnt/weknora-data/weknora-v2-scratch/general-agent
      type: Directory
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1500m
      memory: 2Gi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
