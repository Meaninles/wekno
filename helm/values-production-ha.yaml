# WeKnora production profile for the existing Moutai CCE cluster.
#
# This is the target production topology, not a staged rollout profile.
# It assumes the prerequisites documented in
# docs/custom/当前版本生产更新部署执行手册.md have been completed:
#   - immutable release images have been pushed to the approved SWR project
#     and the same sandbox digest is available to the host Docker daemon on
#     every app node;
#   - /app/skills/preloaded on every app node was exported from that exact app
#     image and passed the per-node checks in the deployment runbook;
#   - the release scratch directories under
#     /mnt/weknora-data/weknora-v2-scratch exist on .1/.2/.7;
#   - the node labels used below exist;
#   - weknora-agent-internal contains apiKey;
#   - weknora-model-runtime was captured from the current production app and
#     contains the existing Anthropic/LiteLLM runtime settings;
#   - the existing OBS configuration and object prefix have been captured and
#     verified read-only; this release does not migrate or rewrite source files.
#
# No RWX storage or CSI provisioning is introduced. Durable source files stay
# in their current private OBS prefix. Parsing and Agent workspaces are
# disposable hostPath scratch directories on the three existing app nodes.

global:
  imagePullSecrets:
    - name: default-secret

serviceAccount:
  create: true
  automountServiceAccountToken: false

app:
  enabled: true
  replicaCount: 3
  runtimeRoles:
    enabled: true
    # render-and-validate-release.sh produces a separate gated manifest with
    # this overridden to true; the final target remains unsuspended.
    startSuspended: false
    environment: production
    postgresMaxConnections: 100
    redisNamespace: prod-cce-wk-6a9d12b0
    parseWorker:
      enabled: true
      replicaCount: 3
      maxOpenConns: 5
      maxIdleConns: 2
      scratch:
        volumeType: hostPath
        hostPath:
          path: /mnt/weknora-data/weknora-v2-scratch/parse
          type: Directory
      nodeSelector:
        weknora.io/document-worker: "true"
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
          ephemeral-storage: 256Mi
        limits:
          cpu: "3"
          memory: 5Gi
          ephemeral-storage: 2Gi
    derivativeWorker:
      enabled: true
      replicaCount: 2
      maxOpenConns: 4
      maxIdleConns: 1
      scratch:
        volumeType: hostPath
        hostPath:
          path: /mnt/weknora-data/weknora-v2-scratch/derivative
          type: Directory
      nodeSelector:
        weknora.io/document-worker: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["10.14.201.1", "10.14.201.7"]
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 128Mi
        limits:
          cpu: 1500m
          memory: 2Gi
          ephemeral-storage: 1Gi
    wikiWorker:
      enabled: true
      replicaCount: 2
      maxOpenConns: 4
      maxIdleConns: 1
      scratch:
        volumeType: hostPath
        hostPath:
          path: /mnt/weknora-data/weknora-v2-scratch/wiki
          type: Directory
      nodeSelector:
        weknora.io/document-worker: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["10.14.201.2", "10.14.201.7"]
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 128Mi
        limits:
          cpu: 1500m
          memory: 2Gi
          ephemeral-storage: 1Gi
    maintenance:
      enabled: true
      replicaCount: 2
      maxOpenConns: 3
      maxIdleConns: 1
      scratch:
        volumeType: hostPath
        hostPath:
          path: /mnt/weknora-data/weknora-v2-scratch/maintenance
          type: Directory
      nodeSelector:
        weknora.io/stateless-worker: "true"
      resources:
        requests:
          cpu: 150m
          memory: 384Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: 750m
          memory: 1Gi
          ephemeral-storage: 512Mi
    migration:
      enabled: true
      render: true
      # The protected release overlay must replace this for every run.
      jobNameSuffix: REPLACE_RELEASE_ID
      maxOpenConns: 3
      maxIdleConns: 1
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      scratch:
        volumeType: hostPath
        hostPath:
          path: /mnt/weknora-data/weknora-v2-scratch/migration
          type: Directory
      nodeSelector:
        kubernetes.io/hostname: "10.14.201.7"
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
          ephemeral-storage: 256Mi
        limits:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 2Gi
  # Stop-the-world release: the normal workload starts only after the explicit
  # migration Job succeeds, so no transient fourth copy is scheduled.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  autoscaling:
    enabled: false
  terminationGracePeriodSeconds: 180
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  nodeSelector:
    weknora.io/document-worker: "true"
  image:
    # Mirror this repository to the approved SWR project when push access is
    # granted. The tag must identify the image built from this code state.
    repository: weknora-app-prod
    digest: ""
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  sandbox:
    mode: docker
    timeoutSeconds: "300"
    # Pulled by the host Docker daemon through docker.sock, not by kubelet.
    # Replace with the full immutable SWR reference and authenticate or
    # pre-pull it on every app node.
    dockerImage: weknora-sandbox-prod:horizontal-objectstore-20260726
  resources:
    # API-only role. CPU-heavy parsing is reserved by parseWorker above.
    requests:
      cpu: 500m
      memory: 1280Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 1500m
      memory: 3Gi
      ephemeral-storage: 1Gi
  scratch:
    volumeType: hostPath
    hostPath:
      path: /mnt/weknora-data/weknora-v2-scratch/api
      type: Directory
  env:
    GIN_MODE: release
    # WAF terminates public TLS on 443 and forwards HTTP through ELB port 80.
    # Browser-facing links and IAM OAuth callbacks must still use this origin.
    FRONTEND_BASE_URL: "https://knora.moutai.com.cn"
    # Base SQL migrations are run exactly once by the maintenance replica.
    AUTO_MIGRATE: "false"
    RETRIEVE_DRIVER: postgres
    STORAGE_TYPE: obs
    LOCAL_STORAGE_BASE_DIR: /data/files
    AUTO_RECOVER_DIRTY: "false"
    STREAM_MANAGER_TYPE: redis
    # Each parse replica may issue at most 12 embedding batches. Three fixed
    # replicas therefore stay below the measured 64-way embedding target.
    CONCURRENCY_POOL_SIZE: "12"
    # Complete document workflows per app instance. The system-admin
    # asynq.concurrency setting is authoritative at runtime.
    WEKNORA_ASYNQ_CONCURRENCY: "4"
    CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "6"
    CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "2"
    # Two Wiki replicas x 6 consumers = the scheduler's 12-task Wiki share.
    WEKNORA_WIKI_MAP_TASK_CONCURRENCY: "6"
    ENABLE_GRAPH_RAG: "true"
    TZ: Asia/Shanghai
  connections:
    # PostgreSQL/Neo4j remain the existing separately managed stateful
    # deployments. Their current Services are reused by this chart.
    database:
      host: postgres.weknora.svc.cluster.local
      port: "5432"
      ssl:
        mode: disable
        rootCertFile: ""
        certFile: ""
        keyFile: ""
    redis:
      address: redis.weknora.svc.cluster.local:6379
      db: "0"
      prefix: "stream:"
      tls:
        enabled: false
        caFile: ""
        certFile: ""
        keyFile: ""
        serverName: ""
        insecureSkipVerify: false
    docreader:
      address: docreader.weknora.svc.cluster.local:50051
    neo4j:
      uri: bolt://neo4j.weknora.svc.cluster.local:7687
  documentQueue:
    kubernetesRuntimeVerifier:
      enabled: true
      apiServer: https://kubernetes.default.svc
      containerName: app
      requestTimeout: 5s
      tokenExpirationSeconds: 3600
  agentIntegration:
    enabled: true
    generalAgentURL: http://weknora-custom-general-agent.weknora.svc.cluster.local:8091
    documentProcessingAgentURL: http://weknora-custom-document-processing-agent.weknora.svc.cluster.local:8091
    toolCallbackURL: http://app.weknora.svc.cluster.local:8080/api/v1/custom/general-agent/internal/tools/call
    artifactUploadURL: http://app.weknora.svc.cluster.local:8080/api/v1/custom/general-agent/internal/artifacts/upload
    apiKeySecret:
      name: weknora-agent-internal
      key: apiKey
    artifactStorage:
      provider: obs
      bucket: ap-weknora-obs-zhengshi-01
      # This UUID is this production deployment's durable namespace identity.
      # Never reuse it for a test cluster or restore drill and never rotate it
      # during an ordinary upgrade.
      pathPrefix: weknora/__weknora_private_agent_artifacts_v1__/deployment/prod-cce-wk-6a9d12b0/namespace/6a9d12b0-48d2-46b4-9e40-1a407860838d/
      migrationAllowMissing: "false"
      migrationAllowInvalid: "false"
  professionalSkillStorage:
    provider: obs
    bucket: ap-weknora-obs-zhengshi-01
    pathPrefix: weknora/__weknora_private_professional_skills_v1__/deployment/prod-cce-wk-6a9d12b0/namespace/6a9d12b0-48d2-46b4-9e40-1a407860838d/
  extraEnv:
    # Preserve the current single-instance model runtime exactly. The
    # deployment runbook captures these values from the live app without
    # printing or committing the API key.
    - name: ANTHROPIC_BASE_URL
      valueFrom:
        secretKeyRef:
          name: weknora-model-runtime
          key: ANTHROPIC_BASE_URL
    - name: ANTHROPIC_MODEL
      valueFrom:
        secretKeyRef:
          name: weknora-model-runtime
          key: ANTHROPIC_MODEL
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: weknora-model-runtime
          key: ANTHROPIC_API_KEY
    # These switches were not present in every historical deployment. When
    # present, preserve them so sandbox network/model behavior is unchanged;
    # when absent, the application keeps its existing secure defaults.
    - name: ANTHROPIC_AUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: weknora-model-runtime
          key: ANTHROPIC_AUTH_TOKEN
          optional: true
    - name: WEKNORA_SANDBOX_ALLOW_NETWORK
      valueFrom:
        secretKeyRef:
          name: weknora-model-runtime
          key: WEKNORA_SANDBOX_ALLOW_NETWORK
          optional: true
    - name: WEKNORA_SANDBOX_PASSTHROUGH_ENV
      valueFrom:
        secretKeyRef:
          name: weknora-model-runtime
          key: WEKNORA_SANDBOX_PASSTHROUGH_ENV
          optional: true

    # Ordinary knowledge files and generated private artifacts share the OBS
    # account but use disjoint, auditable prefixes.
    - name: OBS_ENDPOINT
      value: http://10.8.32.252
    - name: OBS_REGION
      value: us-east-1
    - name: OBS_BUCKET_NAME
      value: ap-weknora-obs-zhengshi-01
    - name: OBS_PATH_PREFIX
      value: weknora/__weknora_private_knowledge_objects_v1__/deployment/prod-cce-wk-6a9d12b0/namespace/6a9d12b0-48d2-46b4-9e40-1a407860838d/
    - name: OBS_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: weknora-obs
          key: OBS_ACCESS_KEY
    - name: OBS_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: weknora-obs
          key: OBS_SECRET_KEY
    - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_STORAGE_PROVIDER
      value: obs
    - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_BUCKET
      value: ap-weknora-obs-zhengshi-01
    - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_PATH_PREFIX
      value: weknora/__weknora_claude_sdk_original_inputs_v1__/deployment/prod-cce-wk-6a9d12b0/namespace/6a9d12b0-48d2-46b4-9e40-1a407860838d/
      # Leaf keys are temp/<tenant-id>/<transfer-uuid>.<ext>. Configure an OBS
      # lifecycle rule scoped exactly to this prefix with <=24h expiration as
      # a hard-kill fallback; never include knowledge or artifact prefixes.
    - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_MAX_MB
      value: "50"
    - name: CUSTOM_GENERAL_AGENT_ARTIFACT_UPLOAD_MAX_MB
      value: "128"

    # Uploads larger than the 50 MiB parser transport ceiling are split before
    # DocReader. The public knowledge-source ceiling remains 2 GiB.
    - name: MAX_FILE_SIZE_MB
      value: "50"
    - name: MAX_KNOWLEDGE_SOURCE_FILE_SIZE_MB
      value: "2048"
    - name: DOCREADER_GRPC_MAX_FILE_SIZE_MB
      value: "50"
    - name: CUSTOM_DOCUMENT_SPLIT_TARGET_RATIO
      value: "0.75"
    - name: CUSTOM_DOCUMENT_SPLIT_WORKER_CONCURRENCY
      value: "4"
    - name: CUSTOM_DOCUMENT_SPLIT_PER_DOCUMENT_WINDOW
      value: "4"
    - name: CUSTOM_DOCUMENT_SPLIT_LEASE_DURATION
      value: 2m
    - name: CUSTOM_DOCUMENT_SPLIT_TASK_TIMEOUT
      value: 30m
    - name: CUSTOM_DOCUMENT_SPLIT_RECOVERY_INTERVAL
      value: 10s
    - name: CUSTOM_DOCUMENT_SPLIT_RETRY_BACKOFF_BASE
      value: 30s
    - name: CUSTOM_DOCUMENT_SPLIT_RETRY_BACKOFF_MAX
      value: 5m
    - name: CUSTOM_DOCUMENT_SPLIT_MAX_RETRY
      value: "6"
    - name: CUSTOM_DOCUMENT_SPLIT_MAX_PARTS
      value: "10000"
    - name: CUSTOM_DOCUMENT_SPLIT_MAX_EXPANSION_RATIO
      value: "12"
    - name: CUSTOM_DOCUMENT_SPLIT_QUESTION_STRATA
      value: "256"
    - name: CUSTOM_DOCUMENT_SPLIT_GRAPH_STRATA
      value: "512"
    - name: CUSTOM_DOCUMENT_SPLIT_TABLE_QUESTION_STRATA
      value: "64"
    - name: CUSTOM_DOCUMENT_SPLIT_TABLE_GRAPH_STRATA
      value: "128"
    - name: CUSTOM_DOCUMENT_SPLIT_OFFICE_TIMEOUT_SECONDS
      value: "1800"
    - name: CUSTOM_DOCUMENT_SPLIT_AUDIO_TIMEOUT_SECONDS
      value: "1800"

    # Five chunks per provider request is the production-tested embedding
    # request shape. Keep it explicit so role restarts cannot inherit a
    # different image default.
    - name: BATCH_EMBED_SIZE
      value: "5"

    # Root-document ownership is durable in PostgreSQL. Heartbeats are only
    # suspicion; takeover also requires lease/boot fencing and, where
    # available, an exact Kubernetes termination proof.
    - name: CUSTOM_DOCUMENT_QUEUE_HEARTBEAT_INTERVAL
      value: 10s
    - name: CUSTOM_DOCUMENT_QUEUE_LEASE_DURATION
      value: 90s
    - name: CUSTOM_DOCUMENT_QUEUE_RECOVERY_INTERVAL
      value: 10s
    - name: CUSTOM_DOCUMENT_QUEUE_INSTANCE_STALE_AFTER
      value: 35s
    - name: CUSTOM_DOCUMENT_QUEUE_POLL_INTERVAL
      value: 2s
    - name: CUSTOM_DOCUMENT_QUEUE_SHUTDOWN_DRAIN_TIMEOUT
      value: 120s
    - name: CUSTOM_DOCUMENT_QUEUE_WORKFLOW_TIMEOUT
      value: 48h
    # Qwen3.6-35B-A3B has 24 background provider slots. Prefetch 2 yields a
    # 48-task window; derivative:Wiki 3:1 protects 36 derivative tasks and 12
    # Wiki tasks. Two fixed derivative replicas therefore run 18 consumers each.
    - name: WEKNORA_ASYNQ_TASK_CONCURRENCY
      value: "18"
    # Slow VLM work has a dedicated Asynq server, so poison images cannot
    # occupy the generic background worker pool.
    - name: WEKNORA_MULTIMODAL_TASK_CONCURRENCY
      value: "4"
    # Stream VLM responses end-to-end so a genuinely stalled request is
    # distinguishable from a long but progressing OCR/caption generation.
    - name: VLM_STREAMING_ENABLED
      value: "true"
    - name: VLM_FIRST_TOKEN_TIMEOUT_SECONDS
      value: "180"
    - name: VLM_STREAM_IDLE_TIMEOUT_SECONDS
      value: "45"
    - name: VLM_TOTAL_TIMEOUT_SECONDS
      value: "360"
    - name: VLM_OCR_MAX_TOKENS
      value: "5000"
    - name: VLM_CAPTION_MAX_TOKENS
      value: "512"
    - name: CUSTOM_WORK_RETRY_IMAGE_MAX_ATTEMPTS
      value: "10"
    - name: CUSTOM_WORK_RETRY_WIKI_MAX_ATTEMPTS
      value: "10"
    # A Wiki LLM timeout can consume 15 minutes. Retry through the durable
    # per-document queue instead of repeating three times while holding the
    # KB materialization lease.
    - name: CUSTOM_WORK_RETRY_WIKI_INLINE_ATTEMPTS
      value: "1"
    - name: CUSTOM_WORK_RETRY_WIKI_CALL_TIMEOUT_SECONDS
      value: "900"
    - name: WEKNORA_LLM_CHAT_TIMEOUT_SECONDS
      value: "900"

    # Bound models read concurrency/RPM/TPM from the actual-model resource
    # pools managed by the Capacity Control page. Environment concurrency
    # values are deliberately absent so they cannot look authoritative while
    # being shadowed by persisted route policies.
    - name: CUSTOM_MODEL_ADMISSION_ENABLED
      value: "true"
    - name: CUSTOM_MODEL_ADMISSION_FAIL_CLOSED
      value: "true"
    - name: CUSTOM_MODEL_ADMISSION_KEY_PREFIX
      value: "weknora:prod-cce-wk-6a9d12b0:model-admission:v1:"
    # Keep the existing Docker sandbox feature available on every app node.
    # Runs are one-shot (`docker run --rm`), so no session affinity is needed.
    - name: SSRF_WHITELIST_EXTRA
      value: 10.0.11.36,10.0.11.37,weknora-litellm,weixin.moutai.com,weixin.moutai.com.cn,llmgateway.moutai.com.cn
  extraVolumes:
    - name: docker-socket
      hostPath:
        path: /var/run/docker.sock
        type: Socket
    # The sandbox image is pulled by the host Docker daemon rather than
    # kubelet. Let appuser authenticate to the same SWR registry if node image
    # GC removed the pre-pulled image.
    - name: sandbox-registry-config
      secret:
        secretName: default-secret
        defaultMode: 0444
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: sandbox-skills
      hostPath:
        # Docker bind sources are resolved by the host daemon. Keep this exact
        # host path in sync with the app image on every eligible app node.
        path: /app/skills/preloaded
        type: Directory
  extraVolumeMounts:
    - name: docker-socket
      mountPath: /var/run/docker.sock
    - name: sandbox-registry-config
      mountPath: /home/appuser/.docker
      readOnly: true
    - name: sandbox-skills
      mountPath: /app/skills/preloaded
      readOnly: true

docreader:
  enabled: true
  replicaCount: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  autoscaling:
    enabled: false
  terminationGracePeriodSeconds: 90
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  nodeSelector:
    weknora.io/document-worker: "true"
  image:
    # Build from this repository so parser and document-splitter fixes match
    # the app. Replace with the approved SWR project path before rendering.
    repository: weknora-docreader-prod
    digest: ""
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 750m
      memory: 1Gi
      ephemeral-storage: 256Mi
    limits:
      cpu: "4"
      memory: 4Gi
      ephemeral-storage: 2Gi
  scratch:
    volumeType: hostPath
    hostPath:
      path: /mnt/weknora-data/weknora-v2-scratch/docreader
      type: Directory
  service:
    type: ClusterIP
    port: 50051
    headless: true
  extraEnv:
    - name: DOCREADER_GRPC_MAX_WORKERS
      value: "4"
    - name: DOCREADER_REQUEST_TIMEOUT_SECONDS
      # A parser runs in a disposable process group. This hard deadline is
      # shorter than the app's 30-minute RPC deadline so malformed documents
      # cannot permanently retain a DocReader worker.
      value: "600"
    - name: DOCREADER_PROCESS_KILL_GRACE_SECONDS
      value: "3"
    - name: DOCREADER_GRPC_MAX_FILE_SIZE_MB
      value: "50"
    - name: DOCREADER_PDF_RENDER_PARALLELISM
      # Keep the former production single-instance value. Three replicas raise
      # aggregate PDF rendering parallelism from 4 to 12 without slowing one
      # large document merely because it landed on a new worker.
      value: "4"
    - name: DOCREADER_PDF_RENDER_MAX_WORKERS
      value: "1"
    - name: DOCREADER_MARKITDOWN_MAX_WORKERS
      value: "1"
    - name: DOCREADER_ODL_MAX_WORKERS
      value: "1"
    - name: DOCREADER_ODL_HYBRID
      value: "off"

