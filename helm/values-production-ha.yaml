        everest.io/csi.volume-name-prefix: wk-doc-agent-tmp
  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      cpu: "3"
      memory: 4Gi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
