frontend:
  enabled: true
  replicaCount: 2
  strategy:
    # There are exactly two stateless-worker nodes. Delete one old pod before
    # creating its replacement so required host anti-affinity cannot deadlock.
    maxSurge: 0
    maxUnavailable: 1
  image:
    repository: weknora-ui-prod
    digest: ""
    tag: horizontal-objectstore-20260726
    pullPolicy: IfNotPresent
