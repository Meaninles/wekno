#
# WeKnora Helm Chart Values
#
# Best Practices References:
# - https://helm.sh/docs/chart_best_practices/values/
# - https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
# - https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml

# -- Global configuration shared across all components
# @default -- See values.yaml
global:
  # -- Storage class for all PersistentVolumeClaims
  # Set to "-" to use cluster default, or specify a storage class name
  storageClass: ""

  # -- Image pull secrets for private registries
  # @default -- []
  imagePullSecrets: []
  # - name: regcred

  # -- Default security context for all pods
  # Note: Official images (nginx, postgres, redis) run as root by default
  # Enable runAsNonRoot only if using non-root compatible images
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # -- Default security context for all containers
  # Note: readOnlyRootFilesystem disabled as images require writable filesystem
  containerSecurityContext:
    allowPrivilegeEscalation: false

# -- ServiceAccount configuration
# Ref: https://helm.sh/docs/chart_best_practices/rbac/
serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- ServiceAccount name (auto-generated if empty)
  name: ""
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Labels to add to the ServiceAccount
  labels: {}
  # -- Automount API credentials for the ServiceAccount
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# App (Backend API Server)
# -----------------------------------------------------------------------------
app:
  # -- Enable the app component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  # -- Horizontal autoscaling for complete document-processing replicas.
  # Scale-down is intentionally conservative because a replica may own long
  # document workflows; SIGTERM still drains/requeues them safely.
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 30
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 2
            periodSeconds: 60
        selectPolicy: Max
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
        selectPolicy: Min

  # -- Pod termination budget. Covers HTTP drain plus the document and
  # background Asynq shutdown windows before Kubernetes sends SIGKILL.
  terminationGracePeriodSeconds: 120

  documentQueue:
    kubernetesRuntimeVerifier:
      # -- Allow healthy app replicas to prove an exact stale Pod/container
      # terminated before transferring its document workflow lease.
      enabled: true
      apiServer: https://kubernetes.default.svc
      containerName: app
      requestTimeout: 5s
      tokenExpirationSeconds: 3600

  # -- Prefer spreading complete workers across nodes. ScheduleAnyway keeps a
  # single-node development cluster usable; production may choose DoNotSchedule.
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  image:
    # -- Image repository
    repository: wechatopenai/weknora-app
    # -- Image tag (defaults to Chart.appVersion if empty)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 10Gi

  # -- Per-pod temporary workspace used by conversions and streamed parts.
  scratch:
    # emptyDir is suitable only when kubelet ephemeral storage is large
    # enough. "ephemeral" creates one isolated RWO PVC per Pod and is the
    # production choice when a node-local CSI/local-path StorageClass is
    # backed by the dedicated parsing disk.
    volumeType: emptyDir
    sizeLimit: 8Gi
    ephemeral:
      storageClassName: ""
      size: 20Gi
      accessModes:
        - ReadWriteOnce
      annotations: {}

  # -- Pod security context override
  podSecurityContext: {}

  # -- Container security context override
  # Note: App requires write access for file storage
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Environment variables for the app container
  # Ref: https://github.com/Tencent/WeKnora/blob/main/docker-compose.yml
  env:
    GIN_MODE: release
    # -- Retrieval driver: postgres, elasticsearch_v7, elasticsearch_v8, qdrant
    RETRIEVE_DRIVER: postgres
    # -- Storage type: local, minio, cos, tos, s3
    STORAGE_TYPE: local
    LOCAL_STORAGE_BASE_DIR: /data/files
    AUTO_RECOVER_DIRTY: "true"
    STREAM_MANAGER_TYPE: redis
    CONCURRENCY_POOL_SIZE: "5"
    # -- Complete document workflows per app replica. The System Admin setting
    # `asynq.concurrency` overrides this fallback at runtime.
    WEKNORA_ASYNQ_CONCURRENCY: "4"
    # -- Per-replica PostgreSQL pool. Keep
    # maxReplicas * MAX_OPEN_CONNS plus a 20% operational reserve below the
    # database server/proxy connection limit.
    CUSTOM_DATABASE_POOL_MAX_OPEN_CONNS: "10"
    CUSTOM_DATABASE_POOL_MAX_IDLE_CONNS: "4"
    # -- Per-replica consumers for document-local Wiki Map work. This queue is
    # isolated from ordinary derivatives so a large Wiki backlog cannot occupy
    # the generic worker pool. Provider-wide limits remain enforced through
    # the shared Redis model-admission layer.
    WEKNORA_WIKI_MAP_TASK_CONCURRENCY: "4"
    ENABLE_GRAPH_RAG: "false"
    TZ: UTC

  # -- Shared service endpoints. Override these when the bundled components
  # are disabled. All app replicas must use the same PostgreSQL and Redis.
  connections:
    database:
      host: postgres
      port: "5432"
      ssl:
        # -- libpq mode: disable, allow, prefer, require, verify-ca, verify-full
        mode: disable
        rootCertFile: ""
        certFile: ""
        keyFile: ""
    redis:
      address: redis:6379
      db: "0"
      prefix: "stream:"
      tls:
        enabled: false
        caFile: ""
        certFile: ""
        keyFile: ""
        serverName: ""
        insecureSkipVerify: false
    docreader:
      # Keep the dns:/// compatible service name; a headless Service exposes
      # every ready parser endpoint to the client's round_robin balancer.
      address: docreader:50051
    neo4j:
      uri: bolt://neo4j:7687

  agentIntegration:
    enabled: false
    generalAgentURL: http://weknora-custom-general-agent:8091
    documentProcessingAgentURL: http://weknora-custom-document-processing-agent:8091
    toolCallbackURL: http://app:8080/api/v1/custom/general-agent/internal/tools/call
    artifactUploadURL: http://app:8080/api/v1/custom/general-agent/internal/artifacts/upload
    apiKeySecret:
      name: general-agent-secret
      key: apiKey
    artifactStorage:
      # Durable Agent artifacts support only private MinIO or OBS commits.
      provider: ""
      bucket: ""
      # Generate this namespace UUID once per cluster/environment and then keep
      # it stable. Restore drills and test clusters must use a different UUID.
      # Do not put usernames, source filenames or customer data in this path.
      pathPrefix: weknora/__weknora_private_agent_artifacts_v1__/deployment/dev-local/namespace/74b3d025-5a14-4a6d-b0fc-ff228d0ba98c/
      migrationAllowMissing: "false"
      migrationAllowInvalid: "false"

  # -- Additional environment variables
  extraEnv: []
  # - name: OLLAMA_BASE_URL
  #   value: "http://ollama:11434"
  # The two Claude SDK sidecar pools can be deployed by this chart through
  # generalAgent/documentProcessingAgent below. General, knowledge manager,
  # data-analysis and table-analysis use the general pool; document-processing
  # uses the document-processing pool.
  # - name: CUSTOM_GENERAL_AGENT_URL
  #   value: "http://weknora-custom-general-agent:8091"
  # - name: CUSTOM_DOCUMENT_PROCESSING_AGENT_URL
  #   value: "http://weknora-custom-document-processing-agent:8091"
  # - name: CUSTOM_GENERAL_AGENT_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: general-agent-secret
  #       key: apiKey
  # - name: CUSTOM_GENERAL_AGENT_TOOL_CALLBACK_URL
  #   value: "http://app:8080/api/v1/custom/general-agent/internal/tools/call"
  # Final artifacts are uploaded to the app's private object-store endpoint
  # before a run is reported complete. Never place their durable root on RWX.
  # - name: CUSTOM_GENERAL_AGENT_ARTIFACT_UPLOAD_URL
  #   value: "http://app:8080/api/v1/custom/general-agent/internal/artifacts/upload"
  # - name: CUSTOM_GENERAL_AGENT_ARTIFACT_STORAGE_PROVIDER
  #   value: "obs"
  # - name: CUSTOM_GENERAL_AGENT_ARTIFACT_PATH_PREFIX
  #   value: "weknora/__weknora_private_agent_artifacts_v1__/deployment/prod-cce-wk-opaqueid/namespace/replace-with-a-unique-rfc4122-uuid/"
  # Claude SDK original-file transfer compatibility:
  # If app.env.STORAGE_TYPE is "obs" and OBS_* are already configured here,
  # general-agent requests automatically reuse OBS with the dedicated prefix
  # shown below. The deployment label and non-zero UUID are stable
  # infrastructure identities; use a different UUID in every independently
  # managed cluster, restore drill, and test environment. The Python sidecar
  # does not need OBS credentials; it only downloads backend-generated
  # temporary URLs.
  # - name: OBS_ENDPOINT
  #   value: "https://obs.cn-north-4.myhuaweicloud.com"
  # - name: OBS_REGION
  #   value: "cn-north-4"
  # - name: OBS_ACCESS_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: obs-secret
  #       key: accessKey
  # - name: OBS_SECRET_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: obs-secret
  #       key: secretKey
  # - name: OBS_BUCKET_NAME
  #   value: "weknora"
  # Optional explicit override:
  # - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_STORAGE_PROVIDER
  #   value: "obs"
  # - name: CUSTOM_GENERAL_AGENT_ORIGINAL_INPUT_PATH_PREFIX
  #   value: "weknora/__weknora_claude_sdk_original_inputs_v1__/deployment/prod-cce-wk-opaqueid/namespace/replace-with-a-unique-rfc4122-uuid/"

  # -- Additional pod volumes and mounts, for example external PostgreSQL and
  # Redis CA/client-certificate Secrets.
  extraVolumes: []
  extraVolumeMounts: []

  # -- Service configuration
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Let migrations and dependency initialization complete without causing
  # a restart loop. Liveness takes over only after startup succeeds once.
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 36

  # -- Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Frontend (Web UI)
# -----------------------------------------------------------------------------
frontend:
  # -- Enable the frontend component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  maxFileSizeMB: "50"
  maxKnowledgeSourceFileSizeMB: "2048"

  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  image:
    # -- Image repository
    repository: wechatopenai/weknora-ui
    # -- Image tag
    tag: latest
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    # readOnlyRootFilesystem: true  # Disabled - images require writable fs
    allowPrivilegeEscalation: false

  # -- Service configuration
  service:
    type: ClusterIP
    port: 80

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Mobile Web UI
# -----------------------------------------------------------------------------
mobileWeb:
  # -- Enable the mobile web component mounted at /mobile/
  enabled: false

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository
    repository: weknora-mobile-web
    # -- Image tag
    tag: local
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  maxFileSizeMB: "50"
  maxKnowledgeSourceFileSizeMB: "2048"

  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # -- Container security context
  securityContext:
    allowPrivilegeEscalation: false

  # -- Service configuration
  service:
    type: ClusterIP
    port: 80

  # -- Backend app service host for mobile nginx proxy
  appHost: app

  # -- Backend app service port for mobile nginx proxy
  appPort: 8080

  # -- Backend app scheme for mobile nginx proxy
  appScheme: http

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Docreader (Document Parser - gRPC)
# -----------------------------------------------------------------------------
docreader:
  # -- Enable the docreader component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 15
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 2
            periodSeconds: 60
        selectPolicy: Max
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
        selectPolicy: Min

  terminationGracePeriodSeconds: 60

  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  image:
    # -- Image repository
    repository: wechatopenai/weknora-docreader
    # -- Image tag
    tag: latest
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 2Gi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 20Gi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Environment variables
  env:
    STORAGE_TYPE: local

  # -- Extra parser environment variables, for example
  # DOCREADER_GRPC_MAX_WORKERS and PDF_PROCESS_CONCURRENCY.
  extraEnv: []

  # -- Bounded per-pod conversion workspace. Large PDF/Office workloads must
  # be sized together with node ephemeral storage and the container limits.
  scratch:
    volumeType: emptyDir
    sizeLimit: 16Gi
    ephemeral:
      storageClassName: ""
      size: 40Gi
      accessModes:
        - ReadWriteOnce
      annotations: {}

  # -- Service configuration
  service:
    type: ClusterIP
    port: 50051
    # -- Return every healthy DocReader pod through DNS so the app gRPC
    # round_robin policy can distribute parses and fail over between replicas.
    headless: true

  # -- Local-only gRPC health probe port inside the docreader container
  healthPort: 50052

  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 36

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Custom general-agent pool
# -----------------------------------------------------------------------------
generalAgent:
  enabled: false
  replicaCount: 2
  terminationGracePeriodSeconds: 45
  image:
    repository: weknora-custom-general-agent
    tag: local
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8091
  apiKeySecret:
    name: general-agent-secret
    key: apiKey
  env:
    maxTurns: "30"
    maxArtifactMB: "20"
    apiTimeoutMS: "600000"
    idleTimeoutMS: "900000"
  extraEnv: []
  scratch:
    volumeType: emptyDir
    sizeLimit: 4Gi
    ephemeral:
      storageClassName: ""
      size: 20Gi
      accessModes:
        - ReadWriteOnce
      annotations: {}
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 4Gi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Custom document-processing-agent pool
# -----------------------------------------------------------------------------
documentProcessingAgent:
  enabled: false
  replicaCount: 2
  terminationGracePeriodSeconds: 60
  image:
    repository: weknora-custom-document-processing-agent
    tag: local
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8091
  apiKeySecret:
    name: general-agent-secret
    key: apiKey
  env:
    maxTurns: "30"
    maxArtifactMB: "20"
    apiTimeoutMS: "600000"
    idleTimeoutMS: "900000"
  extraEnv: []
  scratch:
    volumeType: emptyDir
    sizeLimit: 8Gi
    ephemeral:
      storageClassName: ""
      size: 40Gi
      accessModes:
        - ReadWriteOnce
      annotations: {}
  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      cpu: "4"
      memory: 6Gi
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------------
# PostgreSQL (ParadeDB - Vector + BM25 Search)
# -----------------------------------------------------------------------------
postgresql:
  # -- Enable PostgreSQL
  enabled: true

  image:
    # -- Image repository (ParadeDB for vector search)
    repository: paradedb/paradedb
    # -- Image tag
    tag: v0.18.9-pg17

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Container security context
  # Note: PostgreSQL requires specific user permissions
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Redis (Stream & Task Queue)
# -----------------------------------------------------------------------------
redis:
  # -- Enable Redis
  enabled: true

  image:
    # -- Image repository
    repository: redis
    # -- Image tag
    tag: 7-alpine

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    # readOnlyRootFilesystem: true  # Disabled - images require writable fs
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 1Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Data Files Storage
# -----------------------------------------------------------------------------
dataFiles:
  # -- Local per-pod fallback only when persistence is disabled. Production
  # horizontal deployments should use object storage rather than this path.
  emptyDir:
    sizeLimit: 8Gi
  persistence:
    # -- Enable persistence for uploaded files
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""
    # -- Optional component-specific class. This is commonly an RWX file
    # storage class and should not be shared with database block volumes.
    storageClass: ""
    # -- Local storage with multiple app replicas requires a RWX-capable
    # storage class. Prefer object storage for production horizontal scaling.
    accessModes:
      - ReadWriteOnce

# -----------------------------------------------------------------------------
# Metrics
# -----------------------------------------------------------------------------
metrics:
  # -- Expose bounded-cardinality Prometheus metrics at the app /metrics path.
  enabled: true
  serviceMonitor:
    # -- Requires the monitoring.coreos.com/v1 ServiceMonitor CRD.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  # -- Enable ingress
  enabled: false

  # -- Ingress class name
  className: nginx

  # -- Ingress hostname
  host: weknora.example.com

  # -- TLS configuration
  tls:
    # -- Enable TLS
    enabled: false
    # -- TLS secret name
    secretName: ""

  # -- Additional annotations
  # Ref: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
  annotations:
    # Knowledge source uploads support 2 GiB. Keep every outer ELB and ingress
    # hop at least this large. The separate internal Agent request ceiling is
    # 128 MiB because a 50 MiB attachment expands in Base64 JSON.
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# -----------------------------------------------------------------------------
# Secrets Configuration
# -----------------------------------------------------------------------------
# IMPORTANT: Do NOT use default values in production!
# Use --set or external secret management (External Secrets Operator, Vault, etc.)
#
# Example installation:
#   helm install weknora ./helm \
#     --set secrets.dbPassword=<secure-password> \
#     --set secrets.redisPassword=<secure-password> \
#     --set secrets.jwtSecret=<secure-random-string>
#
secrets:
  # -- Database username
  dbUser: postgres
  # -- Database password (REQUIRED: change in production)
  dbPassword: ""
  # -- Database name
  dbName: weknora
  # -- Redis username (OPTIONAL: for Redis 6.0+ ACL)
  redisUsername: ""
  # -- Redis password (REQUIRED: change in production)
  redisPassword: ""
  # -- JWT signing secret (REQUIRED: change in production)
  jwtSecret: ""
  # -- Tenant AES encryption key (32 bytes).
  # STRONGLY RECOMMENDED to set this explicitly in production.
  # If left empty, a random 32-char value is generated on first install and
  # reused on subsequent `helm upgrade` via Secret lookup. However, if the
  # Secret is ever deleted/recreated (e.g. namespace recreated, GitOps prune,
  # cluster rebuilt) a new random value will be generated and any data
  # encrypted with the old key becomes UNRECOVERABLE.
  tenantAesKey: ""
  # -- System AES-256 key for database field encryption (must be exactly 32 bytes).
  # Encrypts: tenants.api_key, model API keys, vector store credentials,
  # web search provider keys, WeKnoraCloud.AppSecret.
  # STRONGLY RECOMMENDED to set this explicitly in production. Same caveat as
  # tenantAesKey: losing this key makes all encrypted fields unreadable
  # (the UI will display ciphertext like "enc:v1:..." instead of plaintext).
  systemAesKey: ""

  # -- Use existing secret instead of creating one
  # The secret must contain keys: DB_USER, DB_PASSWORD, DB_NAME, REDIS_USERNAME, REDIS_PASSWORD, JWT_SECRET, TENANT_AES_KEY, SYSTEM_AES_KEY
  existingSecret: ""

# -----------------------------------------------------------------------------
# Optional Components (Profiles from docker-compose)
# -----------------------------------------------------------------------------

# -- MinIO configuration (S3-compatible storage)
# Equivalent to: docker compose --profile minio
minio:
  # -- Enable MinIO
  enabled: false
  image:
    repository: minio/minio
    tag: latest
  # -- Root user
  rootUser: minioadmin
  # -- Root password (REQUIRED if enabled)
  rootPassword: ""
  persistence:
    enabled: true
    size: 20Gi

# -- Neo4j configuration (Knowledge Graph)
# Equivalent to: docker compose --profile neo4j
# Required for GraphRAG feature (ENABLE_GRAPH_RAG=true)
neo4j:
  # -- Enable Neo4j for GraphRAG
  enabled: false

  image:
    # -- Image repository
    repository: neo4j
    # -- Image tag (matches docker-compose.yml)
    tag: "2025.10.1"

  # -- Neo4j authentication username
  username: neo4j
  # -- Neo4j authentication password (REQUIRED if enabled)
  password: ""

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # -- Container security context
  securityContext:
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -- Qdrant configuration (Vector Database)
# Equivalent to: docker compose --profile qdrant
qdrant:
  # -- Enable Qdrant as alternative vector store
  enabled: false
  image:
    repository: qdrant/qdrant
    tag: latest
  persistence:
    enabled: true
    size: 10Gi
